<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>Spektrogram</title>

<style>
body {
  font-family: Arial;
}

#waveform {
  height: 100px;
  background: #111;
}

#spectrogram {
  height: 300px;
  background: black;
}
</style>
</head>
<body>

<h1>Spektrogram</h1>

<button id="play">▶ Play</button>

<div id="waveform"></div>
<div id="spectrogram"></div>

<!-- DŮLEŽITÉ: STARÁ VERZE -->
<script src="https://unpkg.com/wavesurfer.js@2.0.6/dist/wavesurfer.min.js"></script>
<script src="https://unpkg.com/wavesurfer.js@2.0.6/dist/plugin/wavesurfer.spectrogram.min.js"></script>
<script src="https://unpkg.com/colormap@2.3.2/colormap.min.js"></script>

<script>
var wavesurfer = WaveSurfer.create({
  container: '#waveform',
  waveColor: '#555',
  progressColor: '#0f0',
  height: 100,
  plugins: [
    WaveSurfer.spectrogram.create({
      container: '#spectrogram',
      labels: true,
      fftSamples: 1024,
      colorMap: colormap({
        colormap: 'viridis',
        nshades: 256,
        format: 'float'
      })
    })
  ]
});

// ⚠️ cesta k mp3 – MUSÍ být relativní
wavesurfer.load('.https://github.com/rammfancze/rammfancze.github.io/raw/refs/heads/main/previews/inflames_rfp_sample.mp3');

// autoplay NE – ručně klikem
document.getElementById('play').onclick = function () {
  wavesurfer.playPause();
};
</script>

</body>
</html>
