<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>rammfanCZE IEM archive</title>
    <meta property="og:title" content="rammfanCZE IEM archive" />
    <meta property="og:description" content="live video recordings // IEM archive" />
    <meta property="og:image" content="https://raw.githubusercontent.com/rammfancze/rammfancze.github.io/refs/heads/main/logo.png" />
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&family=Inter:wght@400;600&display=swap" rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180.png">
    <link rel="apple-touch-icon" sizes="152x152" href="/apple-touch-icon-152.png">
    <link rel="apple-touch-icon" sizes="120x120" href="/apple-touch-icon-120.png">    
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-gradient-to-br from-gray-900 via-gray-800 to-black text-white min-h-screen">

<header class="p-6 md:p-8 bg-black/70 backdrop-blur border-b border-gray-700 shadow-xl">
    <div class="max-w-6xl mx-auto flex flex-col gap-2">
        <h1 class="text-3xl md:text-4xl font-bold tracking-wide flex items-center">
            <span class="text-white">rammfan</span>
            <span style="background: linear-gradient(to bottom, #11457e 0%, #11457e 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">C</span>
            <span style="background: linear-gradient(to bottom, #ffffff 50%, #d71920 50%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">ZE</span>
        </h1>
        <p class="text-gray-400 text-base md:text-lg">live video recordings // IEM archive</p>
    </div>
</header>

<main class="max-w-6xl mx-auto p-4 md:p-12">
    <section class="mb-12 md:mb-16">
        <h2 class="text-2xl md:text-3xl font-semibold text-white mb-4 border-b border-gray-600 pb-2">📅 Upcoming shows</h2>
        <div class="overflow-visible md:overflow-auto bg-transparent md:bg-black/20 md:rounded-lg">
            <table id="upcoming-table" class="w-full table-auto text-sm text-left text-gray-300">
                <thead>
                    <tr class="bg-gray-800 text-gray-100">
                        <th class="px-4 py-3">Artist / Event</th>
                        <th class="px-4 py-3">Date</th>
                        <th class="px-4 py-3">Venue</th>
                    </tr>
                </thead>
                <tbody id="upcoming-tbody">
                    <tr class="animate-skeleton">
                        <td class="px-4 py-3" data-label="Artist"><div class="skeleton-bar"></div></td>
                        <td class="px-4 py-3" data-label="Date"><div class="skeleton-bar"></div></td>
                        <td class="px-4 py-3" data-label="Venue"><div class="skeleton-bar"></div></td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div id="show-more-wrapper" style="min-height: 50px; display: flex; align-items: center; justify-content: center; margin-top: 1.5rem; margin-bottom: 2rem;">
    <button id="toggle-upcoming" class="minimal-btn hidden">Show all upcoming shows</button>
</div>
    </section>
    
    <section class="mb-16">
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-4 border-b border-gray-600 pb-2">
    <h2 class="text-2xl md:text-3xl font-semibold text-white">📋 Recorded shows</h2>
    
    <div class="search-wrapper w-full md:w-72">
        <i class="fa-solid fa-magnifying-glass search-icon"></i>
        <input type="text" id="recorded-search" class="search-input" placeholder="Search artist, venue..." onkeyup="filterTable()">
    </div>
</div>

       <div class="overflow-visible md:overflow-auto bg-transparent md:bg-black/20 md:rounded-lg">
        <table class="w-full table-auto text-sm text-left text-gray-300" id="recorded-table">
            <thead>
                <tr class="bg-gray-800 text-gray-100">
                    <th class="px-4 py-3">Artist</th>
                    <th class="px-4 py-3">Date</th>
                    <th class="px-4 py-3">Venue</th>
                    <th class="px-4 py-3 text-center">YT</th>
                    <th class="px-4 py-3 text-center">IEM</th>
                    <th class="px-4 py-3 text-center">Format</th>
                    <th class="px-4 py-3 text-center" style="width: 280px;">Audio Sample</th>
                </tr>
            </thead>
            <tbody id="recorded-tbody">
                <tr class="animate-skeleton">
                    <td class="px-4 py-3" data-label="Artist"><div class="skeleton-bar"></div></td>
                    <td class="px-4 py-3" data-label="Date"><div class="skeleton-bar"></div></td>
                    <td class="px-4 py-3" data-label="Venue"><div class="skeleton-bar"></div></td>
                    <td class="px-4 py-3 text-center" data-label="YT"><div class="skeleton-bar w-6 mx-auto"></div></td>
                    <td class="px-4 py-3 text-center" data-label="IEM"><div class="skeleton-bar w-6 mx-auto"></div></td>
                    <td class="px-4 py-3 text-center" data-label="Format"><div class="skeleton-bar w-10 mx-auto"></div></td>
                    <td class="px-4 py-3" data-label="Audio"><div class="skeleton-bar w-32 ml-auto"></div></td>
                </tr>
            </tbody>
        </table>
    </div>
    </section>
</main>

<footer class="text-center text-sm text-gray-500 py-6 border-t border-gray-700 bg-black/70">
    <div id="yt-subscribers" class="flex justify-center items-center gap-2 mt-4">
        <a class="flex items-center gap-2 text-white hover:text-red-500 transition-colors" href="https://www.youtube.com/@rammfanCZE" target="_blank">
            <i class="fab fa-youtube text-red-600 text-xl"></i>
            <span id="subscriber-count">Loading subscribers…</span>
        </a>
    </div>
    <div class="mt-4 text-gray-400">
        © 2026 <span class="text-red-500 font-bold">rammfanCZE</span> — Created with love for live sound 🎤
    </div>
</footer>

<script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/fslightbox/3.4.1/index.min.js"></script>
<script src="script.js"></script>

</body>
</html>
