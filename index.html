   async function fetchSubscribers() {

<script>
const URL_RECORDED = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSmAtJ5MvHpsloemXUHYkD-0S0jAyP9RoQLMaOXF-LLUCnW5XlnXE5AAZ2SX3H8SsV7i-RTxx7ZacvI/pub?gid=0&single=true&output=tsv';
const URL_UPCOMING = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSmAtJ5MvHpsloemXUHYkD-0S0jAyP9RoQLMaOXF-LLUCnW5XlnXE5AAZ2SX3H8SsV7i-RTxx7ZacvI/pub?gid=314502273&single=true&output=tsv';

async function nactiTabulky() {
    console.log("Startuji načítání...");
    
    async function stahni(url, targetId, isRecorded) {
        try {
            console.log("Zkouším stáhnout:", targetId);
            const res = await fetch(url);
            const text = await res.text();
            
            if (text.includes("<!DOCTYPE html>")) {
                console.error("CHYBA: Google vrací HTML místo tabulky. Špatně nastaveno 'Publikovat na web'!");
                return;
            }
            
            console.log("Data pro " + targetId + " dorazila. Vykresluji...");
            vykresli(text, targetId, isRecorded);
        } catch (e) {
            console.error("Kritická chyba stahování pro " + targetId + ":", e);
        }
    }

    stahni(URL_RECORDED, 'recorded-tbody', true);
    stahni(URL_UPCOMING, 'upcoming-tbody', false);
}

function vykresli(data, targetId, jeToRecorded) {
    const tbody = document.getElementById(targetId);
    if (!tbody) {
        console.error("CHYBA: Nemůžu najít v HTML tabulku s id: " + targetId);
        return;
    }
    const radky = data.split('\n');
    tbody.innerHTML = ''; 

    for (let i = 1; i < radky.length; i++) {
        const radek = radky[i].trim();
        if (!radek) continue;
        const col = radek.split('\t'); 
        const tr = document.createElement('tr');
        tr.className = "border-b border-gray-700";

        if (jeToRecorded) {
            tr.innerHTML = `
                <td class="px-4 py-2">${col[0] || ''}</td>
                <td class="px-4 py-2">${col[1] || ''}</td>
                <td class="px-4 py-2">${col[2] || ''}</td>
                <td class="px-4 py-2 text-center">${col[3]?.includes('http') ? `<a href="${col[3]}" target="_blank" class="text-blue-400 underline">link</a>` : '❌'}</td>
                <td class="px-4 py-2 text-center">${col[4] === 'Ano' ? '✅' : '❌'}</td>
                <td class="px-4 py-2 text-center">${col[5] || ''}</td>
                <td class="px-0 py-0">${col[6]?.includes('http') ? `<audio controls style="height: 28px; width: 100%;"><source src="${col[6]}" type="audio/mpeg"></audio>` : ''}</td>
            `;
        } else {
            tr.innerHTML = `<td class="px-4 py-2">${col[0] || ''}</td><td class="px-4 py-2">${col[1] || ''}</td><td class="px-4 py-2">${col[2] || ''}</td>`;
        }
        tbody.appendChild(tr);
    }
}
nactiTabulky();
</script>
