<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>rammfanCZE IEM archive</title>
    
    <meta property="og:title" content="rammfanCZE IEM archive" />
    <meta property="og:description" content="Live video recordings // IEM archive" />
    <meta property="og:image" content="http://rammfancze.jecool.net/preview.png" />
    
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&family=Inter:wght@400;600&display=swap" rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"/>

    <style>
        body { font-family: 'Inter', sans-serif; }
        h1, h2, h3 { font-family: 'Orbitron', sans-serif; }

        /* Animace pro Skeleton Loading */
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        .animate-skeleton {
            animation: pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        .skeleton-bar {
            height: 12px;
            background: rgba(156, 163, 175, 0.3);
            border-radius: 4px;
            width: 100%;
        }
    </style>
</head>

<body class="bg-gradient-to-br from-gray-900 via-gray-800 to-black text-white min-h-screen">

<header class="p-8 bg-black/70 backdrop-blur border-b border-gray-700 shadow-xl">
    <div class="max-w-6xl mx-auto flex flex-col gap-2">
        <h1 class="text-4xl font-bold text-red-500 tracking-wide">rammfanCZE</h1>
        <p class="text-gray-400 text-lg">live video recordings // IEM archive</p>
    </div>
</header>

<main class="max-w-6xl mx-auto p-6 md:p-12">
    
    <section class="mb-16">
        <h2 class="text-3xl font-semibold text-white mb-4 border-b border-gray-600 pb-2">📋 Recorded shows</h2>
        <div class="overflow-auto bg-black/20 rounded-lg">
            <table class="w-full table-auto text-sm text-left text-gray-300">
                <thead>
                    <tr class="bg-gray-800 text-gray-100">
                        <th class="px-4 py-3">Artist</th>
                        <th class="px-4 py-3">Date</th>
                        <th class="px-4 py-3">Venue</th>
                        <th class="px-4 py-3 text-center">YT</th>
                        <th class="px-4 py-3 text-center">IEM</th>
                        <th class="px-4 py-3 text-center">Format</th>
                        <th class="px-4 py-3">Audio Sample</th>
                    </tr>
                </thead>
                <tbody id="recorded-tbody">
                    <script>
                        for(let i=0; i<5; i++) {
                            document.write(`
                                <tr class="border-b border-gray-800 animate-skeleton">
                                    <td class="px-4 py-3"><div class="skeleton-bar" style="width: 70%"></div></td>
                                    <td class="px-4 py-3"><div class="skeleton-bar" style="width: 50%"></div></td>
                                    <td class="px-4 py-3"><div class="skeleton-bar" style="width: 80%"></div></td>
                                    <td class="px-4 py-3"><div class="skeleton-bar mx-auto" style="width: 30%"></div></td>
                                    <td class="px-4 py-3"><div class="skeleton-bar mx-auto" style="width: 20%"></div></td>
                                    <td class="px-4 py-3"><div class="skeleton-bar mx-auto" style="width: 40%"></div></td>
                                    <td class="px-4 py-3"><div class="skeleton-bar" style="width: 90%"></div></td>
                                </tr>
                            `);
                        }
                    </script>
                </tbody>
            </table>
        </div>
    </section>

    <section class="mb-16">
        <h2 class="text-3xl font-semibold text-white mb-4 border-b border-gray-600 pb-2">📅 Upcoming shows</h2>
        <div class="overflow-auto bg-black/20 rounded-lg">
            <table class="w-full table-auto text-sm text-left text-gray-300">
                <thead>
                    <tr class="bg-gray-800 text-gray-100">
                        <th class="px-4 py-3">Artist / Event</th>
                        <th class="px-4 py-3">Date</th>
                        <th class="px-4 py-3">Venue</th>
                    </tr>
                </thead>
                <tbody id="upcoming-tbody">
                    <tr class="animate-skeleton">
                        <td class="px-4 py-3"><div class="skeleton-bar"></div></td>
                        <td class="px-4 py-3"><div class="skeleton-bar"></div></td>
                        <td class="px-4 py-3"><div class="skeleton-bar"></div></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>

<footer class="text-center text-sm text-gray-500 py-6 border-t border-gray-700 bg-black/70">
    <div id="yt-subscribers" class="flex justify-center items-center gap-2 mt-4">
        <a class="flex items-center gap-2 text-white hover:text-red-500 transition-colors" href="https://www.youtube.com/@rammfanCZE" target="_blank">
            <i class="fab fa-youtube text-red-600 text-xl"></i>
            <span id="subscriber-count">Loading subscribers…</span>
        </a>
    </div>
    <div class="mt-4 text-gray-400">
        © 2026 <span class="text-red-500 font-bold">rammfanCZE</span> — Created with love for live sound 🎤
    </div>
</footer>

<script>
// KONFIGURACE ODKAZŮ
const URL_RECORDED = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSmAtJ5MvHpsloemXUHYkD-0S0jAyP9RoQLMaOXF-LLUCnW5XlnXE5AAZ2SX3H8SsV7i-RTxx7ZacvI/pub?gid=0&single=true&output=tsv';
const URL_UPCOMING = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSmAtJ5MvHpsloemXUHYkD-0S0jAyP9RoQLMaOXF-LLUCnW5XlnXE5AAZ2SX3H8SsV7i-RTxx7ZacvI/pub?gid=314502273&single=true&output=tsv';

// NAČÍTÁNÍ YOUTUBE SUBS
async function fetchSubscribers() {
    const apiKey = 'AIzaSyDDXVwQNZmlOyHiZqQIUYgMZ-w0QgZIX5g';
    const channelId = 'UCRnSUbTJ-cS-ORYCEF9PEsQ';
    try {
        const response = await fetch(`https://www.googleapis.com/youtube/v3/channels?part=statistics&id=${channelId}&key=${apiKey}`);
        const data = await response.json();
        const count = data.items[0].statistics.subscriberCount;
        document.getElementById("subscriber-count").innerText = `${parseInt(count).toLocaleString()} subscribers`;
    } catch (err) {
        document.getElementById("subscriber-count").innerText = 'YouTube channel';
    }
}

// NAČÍTÁNÍ TABULEK
async function nactiTabulky() {
    const stahni = async (url, targetId, isRecorded) => {
        try {
            const res = await fetch(url);
            if (!res.ok) throw new Error("Chyba stahování");
            const text = await res.text();
            vykresli(text, targetId, isRecorded);
        } catch (e) {
            console.error(e);
            document.getElementById(targetId).innerHTML = '<tr><td colspan="7" class="p-4 text-red-400 text-center">Data momentálně nejsou dostupná.</td></tr>';
        }
    };

    stahni(URL_RECORDED, 'recorded-tbody', true);
    stahni(URL_UPCOMING, 'upcoming-tbody', false);
}

function vykresli(data, targetId, jeToRecorded) {
    const tbody = document.getElementById(targetId);
    const radky = data.split('\n');
    tbody.innerHTML = ''; 

    for (let i = 1; i < radky.length; i++) {
        const radek = radky[i].trim();
        if (!radek) continue;
        const col = radek.split('\t'); 
        const tr = document.createElement('tr');
        tr.className = "border-b border-gray-800 hover:bg-gray-800/30 transition-colors";

        if (jeToRecorded) {
            // Kontrola sloupce H (index 7) - funguje i pro relativní cesty jako spek/...
            const imgPath = col[7] && col[7].trim() !== "" ? col[7].trim() : null;
            const formatText = col[5] || '';

            tr.innerHTML = `
                <td class="px-4 py-4">${col[0] || ''}</td>
                <td class="px-4 py-4">${col[1] || ''}</td>
                <td class="px-4 py-4">${col[2] || ''}</td>
                <td class="px-4 py-4 text-center">
                    ${col[3]?.includes('http') ? `<a href="${col[3]}" target="_blank" class="text-blue-400 hover:text-blue-300 transition-colors underline">link</a>` : '❌'}
                </td>
                <td class="px-4 py-4 text-center">${col[4] === 'Ano' ? '✅' : '❌'}</td>
                
                <td class="px-4 py-4 text-center">
                    ${imgPath 
                        ? `<a href="${imgPath}" target="_blank" class="hover:text-white transition-colors underline decoration-gray-600">${formatText}</a>` 
                        : formatText}
                </td>

                <td class="px-2 py-1">
                    ${col[6]?.includes('http') ? `<audio controls class="h-8 w-48 opacity-80 hover:opacity-100 transition-opacity"><source src="${col[6]}" type="audio/mpeg"></audio>` : ''}
                </td>
            `;
        }
         else {
            tr.innerHTML = `
                <td class="px-4 py-3">${col[0] || ''}</td>
                <td class="px-4 py-3">${col[1] || ''}</td>
                <td class="px-4 py-3">${col[2] || ''}</td>
            `;
        }
        tbody.appendChild(tr);
    }
}

fetchSubscribers();
nactiTabulky();
</script>

</body>
</html>
