<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>rammfanCZE IEM archive</title>
    
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&family=Inter:wght@400;600&display=swap" rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"/>

    <style>
        body { font-family: 'Inter', sans-serif; }
        h1, h2, h3 { font-family: 'Orbitron', sans-serif; }

        /* Styl pro vyhledávání */
        .search-wrapper { position: relative; width: 100%; max-width: 350px; }
        .search-input {
            width: 100%; background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 8px;
            padding: 10px 12px 10px 40px; color: white; outline: none; transition: all 0.2s;
        }
        .search-input:focus { border-color: #ef4444; background: rgba(255,255,255,0.1); }
        .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #6b7280; }

        /* RESPONZIVNÍ ZOBRAZENÍ */
        @media (max-width: 768px) {
            .desktop-only { display: none; }
            .mobile-grid { display: grid; grid-template-columns: 1fr; gap: 1rem; }
        }
        @media (min-width: 769px) {
            .mobile-only { display: none; }
        }

        /* Styl karty pro mobil */
        .concert-card {
            background: rgba(31, 41, 55, 0.4);
            border: 1px solid rgba(75, 85, 99, 0.3);
            border-radius: 12px;
            padding: 16px;
            transition: transform 0.2s;
        }

        audio { height: 32px; width: 100%; filter: sepia(100%) saturate(0%) brightness(150%) invert(100%); }
    </style>
</head>

<body class="bg-gradient-to-br from-gray-900 via-gray-800 to-black text-white min-h-screen">

<header class="p-8 bg-black/70 backdrop-blur border-b border-gray-700 shadow-xl">
    <div class="max-w-6xl mx-auto flex flex-col gap-2 text-center md:text-left">
        <h1 class="text-4xl font-bold text-red-500 tracking-wide">rammfanCZE</h1>
        <p class="text-gray-400 text-lg">live video recordings // IEM archive</p>
    </div>
</header>

<main class="max-w-6xl mx-auto p-4 md:p-12">
    
    <section class="mb-16">
        <h2 class="text-2xl font-semibold text-white mb-6 border-b border-gray-600 pb-2">📅 Upcoming shows</h2>
        <div id="upcoming-container">
            <div class="desktop-only overflow-hidden rounded-lg bg-black/20">
                <table class="w-full text-sm text-left text-gray-300">
                    <thead class="bg-gray-800">
                        <tr>
                            <th class="px-4 py-3">Artist / Event</th>
                            <th class="px-4 py-3">Date</th>
                            <th class="px-4 py-3">Venue</th>
                        </tr>
                    </thead>
                    <tbody id="upcoming-tbody-desktop"></tbody>
                </table>
            </div>
            <div id="upcoming-mobile" class="mobile-only mobile-grid"></div>
        </div>
    </section>
    
    <section class="mb-16">
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6 border-b border-gray-600 pb-4">
            <h2 class="text-2xl font-semibold text-white">📋 Recorded shows</h2>
            <div class="search-wrapper">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="text" id="recorded-search" class="search-input" placeholder="Hledat interpreta, město..." onkeyup="filterContent()">
            </div>
        </div>

        <div id="recorded-container">
            <div class="desktop-only overflow-hidden rounded-lg bg-black/20">
                <table class="w-full text-sm text-left text-gray-300">
                    <thead class="bg-gray-800">
                        <tr>
                            <th class="px-4 py-3">Artist</th>
                            <th class="px-4 py-3">Date</th>
                            <th class="px-4 py-3">Venue</th>
                            <th class="px-4 py-3 text-center">YT</th>
                            <th class="px-4 py-3 text-center">IEM</th>
                            <th class="px-4 py-3 text-center">Format</th>
                            <th class="px-4 py-3">Sample</th>
                        </tr>
                    </thead>
                    <tbody id="recorded-tbody-desktop"></tbody>
                </table>
            </div>
            <div id="recorded-mobile" class="mobile-only mobile-grid"></div>
        </div>
    </section>

</main>

<footer class="text-center text-sm text-gray-500 py-10 border-t border-gray-700 bg-black/70">
    <a class="inline-flex items-center gap-2 text-white hover:text-red-500 transition-colors mb-4" href="https://www.youtube.com/@rammfanCZE" target="_blank">
        <i class="fab fa-youtube text-red-600 text-2xl"></i>
        <span id="subscriber-count">Loading subscribers…</span>
    </a>
    <p>© 2026 <span class="text-red-500 font-bold">rammfanCZE</span> — Created for the fans 🎤</p>
</footer>

<script>
const URL_RECORDED = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSmAtJ5MvHpsloemXUHYkD-0S0jAyP9RoQLMaOXF-LLUCnW5XlnXE5AAZ2SX3H8SsV7i-RTxx7ZacvI/pub?gid=0&single=true&output=tsv';
const URL_UPCOMING = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSmAtJ5MvHpsloemXUHYkD-0S0jAyP9RoQLMaOXF-LLUCnW5XlnXE5AAZ2SX3H8SsV7i-RTxx7ZacvI/pub?gid=314502273&single=true&output=tsv';

function filterContent() {
    const filter = document.getElementById('recorded-search').value.toLowerCase();
    
    // Filtruj Desktop
    const rows = document.getElementById('recorded-tbody-desktop').getElementsByTagName('tr');
    for (let row of rows) {
        row.style.display = row.textContent.toLowerCase().includes(filter) ? "" : "none";
    }
    
    // Filtruj Mobile
    const cards = document.getElementById('recorded-mobile').getElementsByClassName('concert-card');
    for (let card of cards) {
        card.style.display = card.textContent.toLowerCase().includes(filter) ? "" : "none";
    }
}

async function nactiData() {
    try {
        const [resRec, resUpc] = await Promise.all([fetch(URL_RECORDED), fetch(URL_UPCOMING)]);
        const recText = await resRec.text();
        const upcText = await resUpc.text();
        
        vykresliRecorded(recText);
        vykresliUpcoming(upcText);
    } catch (e) { console.error(e); }
}

function vykresliRecorded(data) {
    const desktopTbody = document.getElementById('recorded-tbody-desktop');
    const mobileGrid = document.getElementById('recorded-mobile');
    let radky = data.split('\n').slice(1).reverse();

    radky.forEach(radek => {
        if (!radek.trim()) return;
        const col = radek.split('\t');
        const [artist, date, venue, yt, iem, format, audio, img] = col.map(s => s?.trim() || '');

        // DESKTOP ROW
        const tr = document.createElement('tr');
        tr.className = "border-b border-gray-800 hover:bg-gray-800/30 transition-colors";
        tr.innerHTML = `
            <td class="px-4 py-4 font-semibold">${artist}</td>
            <td class="px-4 py-4 text-gray-400">${date}</td>
            <td class="px-4 py-4 text-gray-400 text-xs uppercase">${venue}</td>
            <td class="px-4 py-4 text-center">${yt ? `<a href="${yt}" target="_blank" class="text-red-600 text-lg"><i class="fab fa-youtube"></i></a>` : '❌'}</td>
            <td class="px-4 py-4 text-center">${iem === 'Ano' ? '✅' : '❌'}</td>
            <td class="px-4 py-4 text-center text-xs">${img ? `<a href="${img}" target="_blank" class="underline">${format}</a>` : format}</td>
            <td class="px-4 py-4">${audio ? `<audio controls src="${audio}"></audio>` : ''}</td>
        `;
        desktopTbody.appendChild(tr);

        // MOBILE CARD
        const card = document.createElement('div');
        card.className = "concert-card";
        card.innerHTML = `
            <div class="flex justify-between items-start mb-2">
                <div>
                    <h3 class="font-bold text-red-500 text-lg leading-tight">${artist}</h3>
                    <p class="text-gray-400 text-sm">${date}</p>
                </div>
                ${yt ? `<a href="${yt}" target="_blank" class="text-red-600 text-2xl"><i class="fab fa-youtube"></i></a>` : ''}
            </div>
            <p class="text-xs uppercase text-gray-500 mb-3"><i class="fa-solid fa-location-dot mr-1"></i> ${venue}</p>
            <div class="flex items-center gap-3 mb-4">
                <span class="text-xs px-2 py-1 bg-gray-800 rounded">IEM: ${iem === 'Ano' ? '✅' : '❌'}</span>
                <span class="text-xs px-2 py-1 bg-gray-800 rounded">Format: ${img ? `<a href="${img}" target="_blank" class="underline">${format}</a>` : format}</span>
            </div>
            ${audio ? `<audio controls src="${audio}"></audio>` : ''}
        `;
        mobileGrid.appendChild(card);
    });
}

function vykresliUpcoming(data) {
    const desktopTbody = document.getElementById('upcoming-tbody-desktop');
    const mobileGrid = document.getElementById('upcoming-mobile');
    let radky = data.split('\n').slice(1).reverse();

    radky.forEach(radek => {
        if (!radek.trim()) return;
        const col = radek.split('\t');
        
        const tr = document.createElement('tr');
        tr.className = "border-b border-gray-800";
        tr.innerHTML = `<td class="px-4 py-3 font-semibold">${col[0]}</td><td class="px-4 py-3">${col[1]}</td><td class="px-4 py-3 text-xs uppercase text-gray-400">${col[2]}</td>`;
        desktopTbody.appendChild(tr);

        const card = document.createElement('div');
        card.className = "concert-card border-l-4 border-red-600";
        card.innerHTML = `<h3 class="font-bold text-white">${col[0]}</h3><p class="text-sm text-gray-400">${col[1]}</p><p class="text-xs text-gray-500 mt-1 uppercase">${col[2]}</p>`;
        mobileGrid.appendChild(card);
    });
}

// YouTube API a načtení
nactiData();
</script>

</body>
</html>
