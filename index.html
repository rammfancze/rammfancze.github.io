<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>rammfanCZE IEM archive</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&family=Inter:wght@400;600&display=swap" rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-900 text-white min-h-screen">

<header class="p-6 bg-black/50 border-b border-gray-800">
    <div class="max-w-6xl mx-auto">
        <h1 class="text-3xl font-bold">
            <span class="text-white">rammfan</span><span class="logo-c">C</span><span class="text-white">Z</span><span class="logo-ze">E</span>
        </h1>
        <p class="text-gray-400 mt-1">live video recordings // IEM archive</p>
    </div>
</header>

<main class="max-w-6xl mx-auto p-4">
    <section class="mb-10">
        <h2 class="text-xl font-semibold mb-4 border-b border-gray-700 pb-2">📅 Upcoming shows</h2>
        <div class="overflow-x-auto">
            <table class="w-full text-sm text-left">
                <tbody id="upcoming-tbody"></tbody>
            </table>
        </div>
    </section>

    <section>
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-4">
            <h2 class="text-xl font-semibold">📋 Recorded shows</h2>
            <div class="search-wrapper">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="text" id="recorded-search" class="search-input" placeholder="Search..." onkeyup="filterTable()">
            </div>
        </div>
        <table class="w-full text-sm text-left">
            <tbody id="recorded-tbody"></tbody>
        </table>
    </section>
</main>

<script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/fslightbox/3.4.1/index.min.js"></script>
<script src="script.js"></script>
</body>
</html>
