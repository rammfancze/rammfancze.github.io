<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>rammfanCZE IEM archive</title>
    
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&family=Inter:wght@400;600&display=swap" rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"/>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0a0a0a; color: #e5e7eb; margin: 0; }
        h1, h2, h3 { font-family: 'Orbitron', sans-serif; }

        #menu-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.98);
            display: none; flex-direction: column; justify-content: center;
            align-items: center; z-index: 9999;
        }
        #menu-overlay.active { display: flex; }

        audio {
            height: 30px; width: 100%; max-width: 200px;
            filter: invert(1) hue-rotate(180deg) brightness(1.5);
            opacity: 0.7;
        }

        @media (max-width: 768px) {
            .desktop-view { display: none; }
            .mobile-view { display: block; }
        }
        @media (min-width: 769px) {
            .desktop-view { display: block; }
            .mobile-view { display: none; }
        }

        .show-card {
            background: #111; border: 1px solid #222; border-radius: 12px;
            padding: 20px; margin-bottom: 16px; position: relative;
            overflow: hidden; background-size: cover; background-position: center;
            transition: transform 0.2s;
        }
        .show-card::before {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(90deg, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.6) 100%);
            z-index: 1;
        }
        .card-content { position: relative; z-index: 2; }

        /* Vyhledávací pole */
        .search-container {
            position: relative;
            max-width: 400px;
            margin-bottom: 2rem;
        }
        .search-input {
            width: 100%;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 12px 16px 12px 40px;
            color: white;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-input:focus { border-color: #dc2626; }
        .search-icon {
            position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
            color: #666;
        }
    </style>
</head>
<body>

<div id="menu-overlay">
    <button onclick="toggleMenu()" class="absolute top-8 right-8 text-4xl text-white">&times;</button>
    <nav class="flex flex-col gap-10 text-3xl font-bold text-center">
        <a href="#" onclick="toggleMenu()" class="hover:text-red-600 transition">Recorded Shows</a>
        <a href="https://www.youtube.com/@rammfanCZE" target="_blank" class="text-red-600 hover:text-white transition">YouTube Channel</a>
    </nav>
</div>

<header class="p-6 bg-black/80 backdrop-blur-md border-b border-gray-800 sticky top-0 z-50">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
        <div>
            <h1 class="text-2xl font-bold text-red-600 tracking-tighter">rammfan<span class="text-white">CZE</span></h1>
            <p class="text-[10px] text-gray-500 uppercase tracking-widest text-right">IEM archive</p>
        </div>
        <button onclick="toggleMenu()" class="bg-gray-800 hover:bg-gray-700 px-4 py-2 rounded border border-gray-700 text-xs font-bold transition flex items-center gap-2">
            MENU <i class="fa-solid fa-bars"></i>
        </button>
    </div>
</header>

<main class="max-w-6xl mx-auto p-4 md:p-12">
    
    <section class="mb-20">
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
            <h2 class="text-xl font-bold italic flex items-center gap-3">
                <i class="fa-solid fa-record-vinyl text-red-600"></i> RECORDED SHOWS
            </h2>
            
            <div class="search-container">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="text" id="searchInput" class="search-input" placeholder="Search artist or venue..." onkeyup="filterShows()">
            </div>
        </div>
        
        <div class="desktop-view overflow-hidden rounded-xl border border-gray-800 bg-black/30">
            <table class="w-full text-sm text-left" id="mainTable">
                <thead class="bg-black/50 text-gray-500 uppercase text-[10px] tracking-[0.2em]">
                    <tr>
                        <th class="px-6 py-4">Artist</th>
                        <th class="px-6 py-4">Date / Venue</th>
                        <th class="px-4 py-4 text-center">YT</th>
                        <th class="px-4 py-4 text-center">IEM</th>
                        <th class="px-4 py-4 text-center">Format</th>
                        <th class="px-6 py-4">Sample</th>
                    </tr>
                </thead>
                <tbody id="recorded-tbody" class="divide-y divide-gray-900"></tbody>
            </table>
        </div>

        <div id="recorded-cards" class="mobile-view"></div>
        <div id="noResults" class="hidden text-center py-20 text-gray-600">No concerts found...</div>
    </section>

</main>

<script>
const URL_RECORDED = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSmAtJ5MvHpsloemXUHYkD-0S0jAyP9RoQLMaOXF-LLUCnW5XlnXE5AAZ2SX3H8SsV7i-RTxx7ZacvI/pub?gid=0&single=true&output=tsv';

function toggleMenu() {
    document.getElementById('menu-overlay').classList.toggle('active');
}

// Funkce pro filtrování
function filterShows() {
    const input = document.getElementById('searchInput');
    const filter = input.value.toLowerCase();
    const tbody = document.getElementById('recorded-tbody');
    const cards = document.getElementById('recorded-cards');
    
    const rows = tbody.getElementsByTagName('tr');
    const mobileCards = cards.getElementsByClassName('show-card');
    let hasAnyMatch = false;

    // Filtruj desktop
    for (let i = 0; i < rows.length; i++) {
        const text = rows[i].textContent.toLowerCase();
        if (text.includes(filter)) {
            rows[i].style.display = "";
            hasAnyMatch = true;
        } else {
            rows[i].style.display = "none";
        }
    }

    // Filtruj mobil
    for (let i = 0; i < mobileCards.length; i++) {
        const text = mobileCards[i].textContent.toLowerCase();
        if (text.includes(filter)) {
            mobileCards[i].style.display = "";
            hasAnyMatch = true;
        } else {
            mobileCards[i].style.display = "none";
        }
    }

    // Ukaž/skryj info o nenalezení
    document.getElementById('noResults').classList.toggle('hidden', hasAnyMatch);
}

async function nacti() {
    try {
        const res = await fetch(URL_RECORDED);
        const data = await res.text();
        vykresli(data);
    } catch (e) { console.error(e); }
}

function vykresli(data) {
    const tbody = document.getElementById('recorded-tbody');
    const cards = document.getElementById('recorded-cards');
    tbody.innerHTML = ''; cards.innerHTML = '';
    
    let radky = data.split('\n').slice(1).reverse();
    
    radky.forEach(radek => {
        if(!radek.trim()) return;
        const col = radek.split('\t');
        
        const artist = col[0] || '';
        const date = col[1] || '';
        const venue = col[2] || '';
        const yt = col[3]?.trim();
        const iem = col[4]?.trim();
        const format = col[5] || '';
        const audio = col[6]?.trim();
        const img = col[7]?.trim();

        // Desktop
        const tr = document.createElement('tr');
        tr.className = "hover:bg-white/[0.02] transition-colors";
        tr.innerHTML = `
            <td class="px-6 py-5 font-bold text-white">${artist}</td>
            <td class="px-6 py-5">
                <div class="text-white">${date}</div>
                <div class="text-[10px] text-gray-500 uppercase font-semibold">${venue}</div>
            </td>
            <td class="text-center">
                ${yt?.startsWith('http') ? `<a href="${yt}" target="_blank" class="text-red-600 text-lg hover:scale-110 inline-block transition"><i class="fab fa-youtube"></i></a>` : '❌'}
            </td>
            <td class="text-center">
                ${iem === 'Ano' ? '<i class="fa-solid fa-circle-check text-green-500 text-lg"></i>' : '❌'}
            </td>
            <td class="text-center">
                ${img?.startsWith('http') ? `<a href="${img}" target="_blank" class="underline text-[10px] font-mono text-gray-400 hover:text-white">${format}</a>` : `<span class="text-[10px] font-mono text-gray-600">${format}</span>`}
            </td>
            <td class="px-6 py-5">
                ${audio?.startsWith('http') ? `<audio controls src="${audio}"></audio>` : ''}
            </td>
        `;
        tbody.appendChild(tr);

        // Mobile
        const card = document.createElement('div');
        card.className = "show-card";
        if(img?.startsWith('http')) card.style.backgroundImage = `url('${img}')`;
        card.innerHTML = `
            <div class="card-content">
                <div class="flex justify-between items-start">
                    <div>
                        <h3 class="font-bold text-white text-lg">${artist}</h3>
                        <p class="text-[11px] text-gray-400 mt-1">${date} • ${venue}</p>
                    </div>
                    ${yt?.startsWith('http') ? `<a href="${yt}" target="_blank" class="text-red-600 text-2xl"><i class="fab fa-youtube"></i></a>` : ''}
                </div>
                <div class="flex gap-2 my-4">
                    ${iem === 'Ano' ? '<span class="text-[9px] bg-green-600/20 text-green-400 px-2 py-0.5 rounded border border-green-500/20 font-bold uppercase">IEM</span>' : ''}
                    <span class="text-[9px] bg-white/10 text-gray-300 px-2 py-0.5 rounded font-mono uppercase">${format}</span>
                </div>
                ${audio?.startsWith('http') ? `<audio class="w-full mt-2" controls src="${audio}"></audio>` : ''}
            </div>
        `;
        cards.appendChild(card);
    });
}

nacti();
</script>
</body>
</html>
