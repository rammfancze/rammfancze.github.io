<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>rammfanCZE IEM archive</title>
    
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"/>

    <style>
        :root {
            --bg-main: #0a0b0d;
            --bg-card: #111217;
            --accent: #e11d48;
            --text-muted: #64748b;
            --border: #1e2128;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg-main);
            color: #e2e8f0;
            margin: 0;
        }

        /* HLAVIČKA */
        header {
            background: rgba(10, 11, 13, 0.8);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 50;
        }

        /* TABULKA STYLE */
        .custom-table th {
            color: var(--text-muted);
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            padding: 1rem 0.5rem;
            border-bottom: 1px solid var(--border);
        }

        .custom-table td {
            padding: 1.25rem 0.5rem;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
        }

        .custom-table tr:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        /* AUDIO PLAYER - Minimalistický vzhled */
        audio {
            height: 28px;
            width: 180px;
            filter: invert(1) hue-rotate(180deg) brightness(1.2);
            opacity: 0.6;
            transition: opacity 0.3s;
        }
        audio:hover { opacity: 1; }

        /* MOBILNÍ KARTY (zobrazení dle obrázku) */
        .mobile-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.25rem;
            margin-bottom: 1rem;
            background-size: cover;
            background-position: center;
            position: relative;
            overflow: hidden;
        }

        .mobile-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to right, rgba(0,0,0,0.9), rgba(0,0,0,0.4));
            z-index: 1;
        }

        .card-content { position: relative; z-index: 2; }

        @media (max-width: 768px) {
            .desktop-only { display: none; }
        }
        @media (min-width: 769px) {
            .mobile-only { display: none; }
        }

        /* MENU MODAL */
        #menu-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            z-index: 100;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>

            <p class="text-xs text-gray-500 uppercase tracking-widest">live video recordings // IEM archive</p>
        </div>
        <button onclick="toggleMenu()" class="bg-gray-800/50 hover:bg-gray-700 px-4 py-2 rounded-md border border-gray-700 text-sm flex items-center gap-2 transition">
            <i class="fa-solid fa-bars"></i> Menu
        </button>
    </div>
</header>
