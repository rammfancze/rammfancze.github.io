<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>rammfanCZE IEM archive</title>
    
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&family=Inter:wght@400;600&display=swap" rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />

    <style>
        :root { --plyr-color-main: #ef4444; }
        body { font-family: 'Inter', sans-serif; background-color: #0b0f1a; color: white; }
        h1, h2, h3 { font-family: 'Orbitron', sans-serif; }

        .format-clickable { color: #ef4444; cursor: pointer; text-decoration: underline; font-weight: 600; }

        /* --- MODAL (PILLOWCASE STYLE) --- */
        #spec-modal { 
            display: none; 
            position: fixed; 
            inset: 0; 
            z-index: 9999; 
            background: rgba(0,0,0,0.95); 
            align-items: center; 
            justify-content: center; 
        }
        .modal-inner {
            width: 90%;
            max-width: 1200px;
            background: #000;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 20px;
            position: relative;
            box-shadow: 0 0 50px rgba(0,0,0,1);
        }
        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 30px;
            cursor: pointer;
            color: #666;
            transition: color 0.2s;
        }
        .close-btn:hover { color: #fff; }

        #spectrogram-canvas {
            width: 100%;
            background: #000;
            min-height: 400px;
        }

        /* Responzivita tabulky */
        @media (max-width: 768px) {
            thead { display: none; }
            tbody tr { display: flex; flex-direction: column; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 0.75rem; margin-bottom: 1rem; padding: 1rem; }
            tbody td { display: flex; justify-content: space-between; padding: 0.6rem 0; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
            tbody td::before { content: attr(data-label); font-weight: 600; color: #9ca3af; font-size: 0.75rem; text-transform: uppercase; }
        }
    </style>
</head>

<body>

<div id="spec-modal" onclick="closeModal()">
    <div class="modal-inner" onclick="event.stopPropagation()">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <h3 id="modal-title" class="text-red-500 mb-6 text-xl font-bold uppercase tracking-tighter"></h3>
        
        <div id="loader-status" class="flex items-center gap-3 text-sm text-gray-400 font-mono mb-4">
            <span class="animate-pulse">⌛ ANALYZING FREQUENCIES...</span>
        </div>

        <div id="spectrogram-canvas"></div>
        <div id="waveform-hidden" style="display:none"></div>
    </div>
</div>

<header class="p-6 md:p-8 bg-black/70 border-b border-gray-700">
    <div class="max-w-6xl mx-auto">
        <h1 class="text-3xl font-bold text-red-500">rammfanCZE</h1>
        <p class="text-gray-400 italic">IEM archive & Spectrograms</p>
    </div>
</header>

<main class="max-w-7xl mx-auto p-4 md:p-12">
    <section class="mb-16">
        <div class="flex justify-between items-center mb-6 border-b border-gray-700 pb-2">
            <h2 class="text-2xl font-bold uppercase tracking-widest">Recorded shows</h2>
            <input type="text" id="recorded-search" class="bg-gray-900 border border-gray-700 rounded px-4 py-2 text-sm focus:border-red-500 outline-none" placeholder="Search artist..." onkeyup="filterTable()">
        </div>

        <div class="overflow-x-auto bg-black/40 rounded-xl">
            <table class="w-full text-left text-sm">
                <thead>
                    <tr class="bg-gray-800/50 text-gray-400 uppercase text-xs">
                        <th class="px-6 py-4">Artist</th>
                        <th class="px-6 py-4">Date</th>
                        <th class="px-6 py-4 text-center">Format</th>
                        <th class="px-6 py-4 text-right">Player</th>
                    </tr>
                </thead>
                <tbody id="recorded-tbody"></tbody>
            </table>
        </div>
    </section>
</main>

<script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
<script src="https://unpkg.com/wavesurfer.js@7"></script>
<script src="https://unpkg.com/wavesurfer.js@7/dist/plugins/spectrogram.min.js"></script>

<script>
const URL_RECORDED = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSmAtJ5MvHpsloemXUHYkD-0S0jAyP9RoQLMaOXF-LLUCnW5XlnXE5AAZ2SX3H8SsV7i-RTxx7ZacvI/pub?gid=0&single=true&output=tsv';

let activeWs = null;

async function loadData() {
    const res = await fetch(URL_RECORDED);
    const text = await res.text();
    const rows = text.split('\n').slice(1).reverse();
    const tbody = document.getElementById('recorded-tbody');

    rows.forEach((line, i) => {
        const col = line.split('\t');
        if (!col[0]) return;
        const audioUrl = col[6]?.trim();

        const tr = document.createElement('tr');
        tr.className = "border-b border-gray-800/50 hover:bg-gray-800/20 transition-all";
        tr.innerHTML = `
            <td class="px-6 py-5 font-semibold text-white" data-label="Artist">${col[0]}</td>
            <td class="px-6 py-5 text-gray-400" data-label="Date">${col[1]}</td>
            <td class="px-6 py-5 text-center" data-label="Format">
                <span class="format-clickable" onclick="openSpectrogram('${col[0]}', '${audioUrl}')">${col[5] || 'WAV'}</span>
            </td>
            <td class="px-6 py-5" data-label="Audio">
                <div style="width:250px; margin-left:auto;">
                    <audio class="js-player" controls src="${audioUrl}"></audio>
                </div>
            </td>
        `;
        tbody.appendChild(tr);
    });
    Plyr.setup('.js-player');
}

function openSpectrogram(artist, url) {
    if (!url || url === "") {
        alert("Odkaz na audio chybí.");
        return;
    }

    const modal = document.getElementById('spec-modal');
    modal.style.display = 'flex';
    document.getElementById('modal-title').innerText = artist;
    document.getElementById('loader-status').style.display = 'flex';
    document.getElementById('spectrogram-canvas').innerHTML = '';

    if (activeWs) activeWs.destroy();

    // DŮLEŽITÉ: Přidání crossorigin, aby se předešlo zaseknutí na "Analyzing"
    activeWs = WaveSurfer.create({
        container: '#waveform-hidden',
        url: url,
        fetchParams: { mode: 'cors' }, // Vynutí CORS režim
        plugins: [
            WaveSurfer.Spectrogram.create({
                container: '#spectrogram-canvas',
                labels: true,
                height: 400, // Velké jako na obrázku
                splitChannels: false,
                colorMap: [
                    [0, 0, 0, 1],         // Černá (ticho)
                    [0.1, 0, 0, 0.5],     // Tmavá
                    [0.4, 0, 1, 0],       // Zelená (středy) - tohle dělá ten libavfilter efekt
                    [0.8, 1, 1, 0],       // Žlutá
                    [1, 1, 0, 0]          // Červená (špičky)
                ]
            })
        ]
    });

    activeWs.on('ready', () => {
        document.getElementById('loader-status').style.display = 'none';
    });

    activeWs.on('error', (err) => {
        console.error(err);
        document.getElementById('loader-status').innerHTML = `<span class="text-red-500">❌ ERROR: Access denied. The file host blocks analysis.</span>`;
    });
}

function closeModal() {
    document.getElementById('spec-modal').style.display = 'none';
    if (activeWs) activeWs.destroy();
}

function filterTable() {
    const val = document.getElementById('recorded-search').value.toLowerCase();
    const rows = document.querySelectorAll('#recorded-tbody tr');
    rows.forEach(r => r.style.display = r.textContent.toLowerCase().includes(val) ? "" : "none");
}

loadData();
</script>
</body>
</html>
