    <title>rammfanCZE IEM archive</title>
    
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&family=Inter:wght@400;600&display=swap" rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"/>

    <style>
        body { font-family: 'Inter', sans-serif; }
        h1, h2, h3 { font-family: 'Orbitron', sans-serif; }

        /* Styl pro kontejner vlnovky */
        .waveform-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.05);
            padding: 5px 12px;
            border-radius: 8px;
            width: 280px;
        }
        .waveform-container {
            flex-grow: 1;
            height: 30px;
            cursor: pointer;
        }
        .play-btn {
            background: none;
            border: none;
            color: #ef4444;
            cursor: pointer;
            font-size: 1.2rem;
            width: 20px;
            display: flex;
            justify-content: center;
        }

        /* Skeleton Loading */
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        .animate-skeleton { animation: pulse 1.5s infinite; }
        .skeleton-bar { height: 12px; background: rgba(156, 163, 175, 0.3); border-radius: 4px; width: 100%; }

        @media (max-width: 768px) {
            thead { display: none; }
            tbody tr {
                display: flex; flex-direction: column;
                background: rgba(255, 255, 255, 0.03);
                border: 1px solid rgba(255, 255, 255, 0.1);
                border-radius: 0.75rem; margin-bottom: 1rem; padding: 1rem;
            }
            tbody td {
                display: flex; justify-content: space-between; align-items: center;
                padding: 0.6rem 0; border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            }
            tbody td::before {
                content: attr(data-label); font-weight: 600; color: #9ca3af;
                font-size: 0.75rem; text-transform: uppercase;
            }
            .waveform-wrapper { width: 100%; max-width: 220px; }
        }
    </style>
</head>
