<head>

    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&family=Inter:wght@400;600&display=swap" rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"/>

    <style>
        body { font-family: 'Inter', sans-serif; }
        h1, h2, h3 { font-family: 'Orbitron', sans-serif; }

        /* Styl pro vyhledávání */
        .search-wrapper { position: relative; max-width: 300px; }
        .search-input {
            width: 100%; background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 6px;
            padding: 8px 12px 8px 35px; color: white; outline: none; font-size: 0.875rem;
        }
        .search-input:focus { border-color: #ef4444; }
        .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #6b7280; font-size: 0.8rem; }

        /* RESPONZIVNÍ KARTY PRO MOBIL */
        @media (max-width: 768px) {
            /* Zrušíme tabulkové zobrazení na mobilu */
            table, thead, tbody, th, td, tr { display: block; width: 100%; }
            thead { display: none; } /* Skryje hlavičku na mobilu */
            
            #recorded-tbody tr, #upcoming-tbody tr {
                background: rgba(0, 0, 0, 0.3);
                border: 1px solid rgba(255, 255, 255, 0.1) !important;
                border-radius: 12px;
                margin-bottom: 1.5rem;
                padding: 1rem;
            }

            /* Styl pro buňky na mobilu */
            td {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 0.5rem 0 !important;
                border: none !important;
                text-align: right !important;
            }

            /* Přidání popisků před data na mobilu */
            td::before {
                content: attr(data-label);
                font-weight: 600;
                font-size: 0.7rem;
                text-transform: uppercase;
                color: #6b7280;
                text-align: left;
            }

            /* První buňka (Interpret) jako nadpis karty */
            td:first-child {
                font-size: 1.2rem;
                font-weight: bold;
                color: #ef4444;
                border-bottom: 1px solid rgba(255, 255, 255, 0.1) !important;
                margin-bottom: 0.5rem;
                padding-bottom: 0.75rem !important;
                justify-content: center;
            }
            td:first-child::before { display: none; }

            /* Audio přehrávač na mobilu na celou šířku */
            audio { width: 100% !important; max-width: none !important; margin-top: 0.5rem; }
        }
    </style>
</head>

    <section class="mb-16">

                    </tr>
                </thead>
                <tbody id="recorded-tbody"></tbody>
            </table>
        </div>
    </section>
</main>

</footer>
