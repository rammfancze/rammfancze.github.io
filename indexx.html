<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>rammfanCZE IEM archive</title>
    
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"/>

    <style>
        :root {
            --bg-main: #0a0b0d;
            --bg-card: #111217;
            --accent: #e11d48;
            --text-muted: #64748b;
            --border: #1e2128;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg-main);
            color: #e2e8f0;
            margin: 0;
            overflow-x: hidden;
        }

        /* MENU - Oprava funkčnosti */
        #menu-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: none; /* Skryté v základu */
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        #menu-overlay.active {
            display: flex;
        }

        /* TABULKA */
        .custom-table th {
            color: var(--text-muted);
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            padding: 1rem 0.5rem;
            border-bottom: 1px solid var(--border);
        }

        .custom-table td {
            padding: 1rem 0.5rem;
            border-bottom: 1px solid var(--border);
        }

        /* AUDIO PLAYER */
        audio {
            height: 30px;
            width: 100%;
            max-width: 200px;
            filter: invert(1) hue-rotate(180deg) contrast(1.5);
            opacity: 0.6;
        }

        /* RESPONSIVITA */
        @media (max-width: 768px) {
            .desktop-only { display: none; }
            .mobile-card {
                background: var(--bg-card);
                border: 1px solid var(--border);
                border-radius: 12px;
                padding: 1.5rem;
                margin-bottom: 1rem;
                position: relative;
                overflow: hidden;
            }
        }
        @media (min-width: 769px) {
            .mobile-only { display: none; }
        }
    </style>
</head>
<body>

<div id="menu-overlay">

    <nav class="flex flex-col gap-8 text-2xl font-bold text-center">
        <a href="#" onclick="toggleMenu()" class="hover:text-red-500">Recorded Shows</a>
        <a href="#upcoming" onclick="toggleMenu()" class="hover:text-red-500">Upcoming</a>
        <a href="https://www.youtube.com/@rammfanCZE" target="_blank" class="hover:text-red-500 text-red-600">YouTube Channel</a>
    </nav>
</div>

<header class="p-6 border-b border-gray-900 bg-black/50 sticky top-0 z-50 backdrop-blur-md">

            <h1 class="text-2xl font-bold tracking-tighter text-red-600">rammfan<span class="text-white">CZE</span></h1>
            <p class="text-[10px] text-gray-500 uppercase tracking-[0.2em]">live video recordings // IEM archive</p>
        </div>
        <button onclick="toggleMenu()" class="bg-gray-800 hover:bg-gray-700 px-4 py-2 rounded border border-gray-700 text-sm flex items-center gap-2">
            <i class="fa-solid fa-bars"></i> Menu

</header>

            <i class="fa-solid fa-record-vinyl text-red-600"></i> Recorded shows

        <div class="desktop-only overflow-x-auto">

                        <th class="text-center">YT</th>

                </thead>
                <tbody id="recorded-desktop">

        <div id="recorded-mobile" class="mobile-only">

    </section>

    <section id="upcoming">

            <i class="fa-regular fa-calendar text-gray-500"></i> Upcoming shows
        </h2>
        <div id="upcoming-container" class="bg-card-bg border border-gray-800 rounded-lg overflow-hidden">
             </div>
    </section>

</main>
