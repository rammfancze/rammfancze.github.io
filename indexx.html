<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>rammfanCZE IEM archive</title>
    
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&family=Inter:wght@400;600&display=swap" rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />

    <style>
        :root { --plyr-color-main: #ef4444; }
        body { font-family: 'Inter', sans-serif; background-color: #0b0f1a; color: white; }
        h1, h2, h3 { font-family: 'Orbitron', sans-serif; }

        /* Styl pro tlačítko Formát (Odkaz na obrázek) */
        .spec-btn {
            display: inline-block !important;
            background: rgba(239, 68, 68, 0.2) !important;
            color: #ef4444 !important;
            padding: 5px 12px !important;
            border: 1px solid #ef4444 !important;
            border-radius: 4px !important;
            font-weight: 700 !important;
            cursor: pointer !important;
            text-decoration: underline !important;
            font-size: 0.8rem;
            text-transform: uppercase;
            position: relative;
            z-index: 10;
            pointer-events: auto !important;
        }
        .spec-btn:hover {
            background: #ef4444 !important;
            color: white !important;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.5);
        }

        /* Responzivita pro mobily */
        @media (max-width: 768px) {
            thead { display: none; }
            tbody tr { display: flex; flex-direction: column; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 0.75rem; margin-bottom: 1rem; padding: 1rem; }
            tbody td { display: flex; justify-content: space-between; align-items: center; padding: 0.6rem 0; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
            tbody td::before { content: attr(data-label); font-weight: 600; color: #9ca3af; font-size: 0.75rem; text-transform: uppercase; }
        }
    </style>
</head>

<body class="bg-gradient-to-br from-gray-900 via-gray-800 to-black min-h-screen text-white">

<header class="p-6 md:p-8 bg-black/70 border-b border-gray-700 shadow-xl">
    <div class="max-w-6xl mx-auto text-center md:text-left">
        <h1 class="text-3xl font-bold text-red-500 tracking-wide">rammfanCZE</h1>
        <p class="text-gray-400">live video recordings // IEM archive</p>
    </div>
</header>

<main class="max-w-7xl mx-auto p-4 md:p-12">
    <section class="mb-16">
        <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4 border-b border-gray-700 pb-4">
            <h2 class="text-2xl font-bold">📋 Recorded shows</h2>
            <input type="text" id="recorded-search" class="bg-gray-900 border border-gray-700 rounded-lg px-4 py-2 text-sm outline-none focus:border-red-500 w-full max-w-xs" placeholder="Search artist..." onkeyup="filterTable()">
        </div>

        <div class="bg-black/40 rounded-xl overflow-hidden shadow-2xl">
            <table class="w-full text-sm text-left text-gray-300">
                <thead class="bg-gray-800 text-gray-100 font-bold">
                    <tr>
                        <th class="px-6 py-4">Artist</th>
                        <th class="px-6 py-4">Date</th>
                        <th class="px-6 py-4">Venue</th>
                        <th class="px-6 py-4 text-center">YT</th>
                        <th class="px-6 py-4 text-center">IEM</th>
                        <th class="px-6 py-4 text-center">Format</th>
                        <th class="px-6 py-4 text-right">Preview</th>
                    </tr>
                </thead>
                <tbody id="recorded-tbody">
                    <tr><td colspan="7" class="p-10 text-center animate-pulse">Načítám archív z Google Sheets...</td></tr>
                </tbody>
            </table>
        </div>
    </section>
</main>

<script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/fslightbox/3.4.1/index.min.js"></script>

<script>
const URL_RECORDED = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSmAtJ5MvHpsloemXUHYkD-0S0jAyP9RoQLMaOXF-LLUCnW5XlnXE5AAZ2SX3H8SsV7i-RTxx7ZacvI/pub?gid=0&single=true&output=tsv';

async function nactiData() {
    try {
        const res = await fetch(URL_RECORDED);
        const text = await res.text();
        const rows = text.split('\n').slice(1).reverse();
        const tbody = document.getElementById('recorded-tbody');
        tbody.innerHTML = '';

        rows.forEach((line, index) => {
            const col = line.split('\t');
            if (!col[0] || col[0].trim() === "") return;

            const artist = col[0].trim();
            const format = col[5]?.trim() || 'WAV';
            const audioUrl = col[6]?.trim() || '';
            const imgUrl = col[7]?.trim() || ''; 

            // LOGOVÁNÍ DO KONZOLE (F12) - pro kontrolu, jestli skript vidí odkazy
            console.log(`Řádek ${index}: Artist: ${artist}, Img: ${imgUrl}`);

            // PODMÍNKA: Pokud sloupec H (imgUrl) není prázdný, udělej tlačítko
            let formatHTML;
            if (imgUrl.length > 5) { // Pokud má odkaz aspoň 5 znaků (http...)
                formatHTML = `<a data-fslightbox="gallery" href="${imgUrl}" class="spec-btn" onclick="console.log('Kliknuto na: ${imgUrl}')">${format}</a>`;
            } else {
                formatHTML = `<span class="text-gray-600 font-bold">${format}</span>`;
            }

            const tr = document.createElement('tr');
            tr.className = "border-b border-gray-800 hover:bg-gray-800/40 transition-all";
            tr.innerHTML = `
                <td class="px-6 py-5 font-bold text-white" data-label="Artist">${artist}</td>
                <td class="px-6 py-5 text-gray-400" data-label="Date">${col[1] || ''}</td>
                <td class="px-6 py-5" data-label="Venue">${col[2] || ''}</td>
                <td class="px-6 py-5 text-center" data-label="YT">
                    ${col[3]?.includes('http') ? `<a href="${col[3]}" target="_blank" class="text-red-600 hover:text-red-400"><i class="fab fa-youtube text-xl"></i></a>` : '❌'}
                </td>
                <td class="px-6 py-5 text-center" data-label="IEM">${col[4] === 'Ano' ? '✅' : '❌'}</td>
                <td class="px-6 py-5 text-center" data-label="Format">${formatHTML}</td>
                <td class="px-6 py-5" data-label="Audio">
                    <div style="width: 250px; margin-left: auto;">
                        ${audioUrl ? `<audio class="js-player" controls src="${audioUrl}"></audio>` : ''}
                    </div>
                </td>
            `;
            tbody.appendChild(tr);
        });

        // Aktivace Plyr přehrávačů
        Plyr.setup('.js-player', { controls: ['play', 'progress', 'current-time', 'mute', 'volume'] });

        // OBNOVENÍ LIGHTBOXU (Extrémně důležité pro dynamický obsah)
        setTimeout(() => {
            if (typeof refreshFsLightbox === "function") {
                refreshFsLightbox();
            }
        }, 500);

    } catch (e) { console.error("Chyba při zpracování dat:", e); }
}

function filterTable() {
    const filter = document.getElementById('recorded-search').value.toLowerCase();
    const rows = document.querySelectorAll('#recorded-tbody tr');
    rows.forEach(row => row.style.display = row.textContent.toLowerCase().includes(filter) ? "" : "none");
}

nactiData();
</script>
</body>
</html>
