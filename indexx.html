<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>rammfanCZE IEM archive</title>
    
    <meta property="og:title" content="rammfanCZE IEM archive" />
    <meta property="og:description" content="live video recordings // IEM archive" />
    <meta property="og:image" content="https://raw.githubusercontent.com/rammfancze/rammfancze.github.io/refs/heads/main/logo.png" />
    
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&family=Inter:wght@400;600&display=swap" rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"/>

    <style>
        body { font-family: 'Inter', sans-serif; }
        h1, h2, h3 { font-family: 'Orbitron', sans-serif; }

        /* Animace pro Skeleton Loading */
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        .animate-skeleton {
            animation: pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        .skeleton-bar {
            height: 12px;
            background: rgba(156, 163, 175, 0.3);
            border-radius: 4px;
            width: 100%;
        }

        /* Styl pro vyhledávání */
        .search-wrapper {
            position: relative;
            max-width: 300px;
        }
        .search-input {
            width: 100%;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 6px;
            padding: 8px 12px 8px 35px;
            color: white;
            outline: none;
            font-size: 0.875rem;
            transition: all 0.2s;
        }
        .search-input:focus {
            background: rgba(255,255,255,0.1);
            border-color: #ef4444;
        }
        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #6b7280;
            font-size: 0.8rem;
        }

        /* RESPONZIVNÍ TABULKA -> KARTY */
        @media (max-width: 768px) {
            thead { display: none; } /* Skryje záhlaví tabulky */
            
            tbody tr {
                display: flex;
                flex-direction: column;
                background: rgba(0, 0, 0, 0.3);
                margin-bottom: 1.5rem;
                padding: 1rem;
                border: 1px solid rgba(255, 255, 255, 0.1) !important;
                border-radius: 12px;
            }

            tbody td {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 0.5rem 0 !important;
                border: none !important;
            }

            /* Štítky pro mobilní zobrazení */
            tbody td::before {
                content: attr(data-label);
                font-weight: 600;
                font-size: 0.75rem;
                text-transform: uppercase;
                color: #6b7280;
            }

            /* První buňka (Artist) bude výraznější */
            tbody td:first-child {
                font-size: 1.25rem;
                font-weight: bold;
                color: white;
                border-bottom: 1px solid rgba(255, 255, 255, 0.1) !important;
                margin-bottom: 0.5rem;
                padding-bottom: 0.75rem !important;
            }
            tbody td:first-child::before { display: none; }

            /* Audio na celou šířku */
            audio { width: 100% !important; }
        }
    </style>
</head>

<body class="bg-gradient-to-br from-gray-900 via-gray-800 to-black text-white min-h-screen">

<header class="p-8 bg-black/70 backdrop-blur border-b border-gray-700 shadow-xl">
    <div class="max-w-6xl mx-auto flex flex-col gap-2">
        <h1 class="text-4xl font-bold text-red-500 tracking-wide">rammfanCZE</h1>
        <p class="text-gray-400 text-lg">live video recordings // IEM archive</p>
    </div>
</header>

<main class="max-w-6xl mx-auto p-6 md:p-12">
    <section class="mb-16">
        <h2 class="text-3xl font-semibold text-white mb-4 border-b border-gray-600 pb-2">📅 Upcoming shows</h2>
        <div class="bg-black/20 rounded-lg">
            <table class="w-full table-auto text-sm text-left text-gray-300">
                <thead>
                    <tr class="bg-gray-800 text-gray-100">
                        <th class="px-4 py-3">Artist / Event</th>
                        <th class="px-4 py-3">Date</th>
                        <th class="px-4 py-3">Venue</th>
                    </tr>
                </thead>
                <tbody id="upcoming-tbody">
                    <tr class="animate-skeleton">
                        <td class="px-4 py-3"><div class="skeleton-bar"></div></td>
                        <td class="px-4 py-3"><div class="skeleton-bar"></div></td>
                        <td class="px-4 py-3"><div class="skeleton-bar"></div></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>
    
    <section class="mb-16">
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-4 border-b border-gray-600 pb-2">
            <h2 class="text-3xl font-semibold text-white">📋 Recorded shows</h2>
            
            <div class="search-wrapper">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="text" id="recorded-search" class="search-input" placeholder="" onkeyup="filterTable()">
            </div>
        </div>

        <div class="bg-black/20 rounded-lg">
            <table class="w-full table-auto text-sm text-left text-gray-300" id="recorded-table">
                <thead>
                    <tr class="bg-gray-800 text-gray-100">
                        <th class="px-4 py-3">Artist</th>
                        <th class="px-4 py-3">Date</th>
                        <th class="px-4 py-3">Venue</th>
                        <th class="px-4 py-3 text-center">YT</th>
                        <th class="px-4 py-3 text-center">IEM</th>
                        <th class="px-4 py-3 text-center">Format</th>
                        <th class="px-4 py-3 text-center">Audio Sample</th>
                    </tr>
                </thead>
                <tbody id="recorded-tbody">
                </tbody>
            </table>
        </div>
    </section>
</main>
