<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>rammfanCZE IEM archive</title>
    
    <meta property="og:title" content="rammfanCZE IEM archive" />
    <meta property="og:description" content="live video recordings // IEM archive" />
    <meta property="og:image" content="https://raw.githubusercontent.com/rammfancze/rammfancze.github.io/refs/heads/main/logo.png" />
    
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&family=Inter:wght@400;600&display=swap" rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"/>

    <style>
        body { font-family: 'Inter', sans-serif; }
        h1, h2, h3 { font-family: 'Orbitron', sans-serif; }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        .animate-skeleton { animation: pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        .skeleton-bar { height: 12px; background: rgba(156, 163, 175, 0.3); border-radius: 4px; width: 100%; }

        .search-wrapper { position: relative; max-width: 300px; }
        .search-input {
            width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 6px; padding: 8px 12px 8px 35px; color: white; outline: none; font-size: 0.875rem; transition: all 0.2s;
        }
        .search-input:focus { background: rgba(255,255,255,0.1); border-color: #ef4444; }
        .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #6b7280; font-size: 0.8rem; }

        /* JEDINÝ PŘIDANÝ STYL PRO MOBILNÍ KARTY */
        @media (max-width: 768px) {
            table, thead, tbody, th, td, tr { display: block; }
            thead { display: none; }
            tr { 
                margin-bottom: 1.5rem; border: 1px solid rgba(255,255,255,0.1) !important; 
                border-radius: 12px; background: rgba(0,0,0,0.3); padding: 1rem;
            }
            td { 
                display: flex; justify-content: space-between; align-items: center; 
                border: none !important; padding: 0.5rem 0 !important; text-align: right !important;
            }
            td::before { 
                content: attr(data-label); font-weight: 600; font-size: 0.75rem; 
                color: #6b7280; text-transform: uppercase; text-align: left;
            }
            td:first-child { 
                justify-content: center; font-size: 1.2rem; font-weight: bold; color: #ef4444;
                border-bottom: 1px solid rgba(255,255,255,0.1) !important; margin-bottom: 0.5rem; padding-bottom: 0.75rem !important;
            }
            td:first-child::before { content: none; }
            audio { width: 100% !important; height: 32px; }
        }
    </style>
</head>

<body class="bg-gradient-to-br from-gray-900 via-gray-800 to-black text-white min-h-screen">

<header class="p-8 bg-black/70 backdrop-blur border-b border-gray-700 shadow-xl">
    <div class="max-w-6xl mx-auto flex flex-col gap-2">
        <h1 class="text-4xl font-bold text-red-500 tracking-wide">rammfanCZE</h1>
        <p class="text-gray-400 text-lg">live video recordings // IEM archive</p>
    </div>
</header>

<main class="max-w-6xl mx-auto p-6 md:p-12">
    <section class="mb-16">
        <h2 class="text-3xl font-semibold text-white mb-4 border-b border-gray-600 pb-2">📅 Upcoming shows</h2>
        <div class="overflow-auto bg-black/20 rounded-lg">
            <table class="w-full table-auto text-sm text-left text-gray-300">
                <thead>
                    <tr class="bg-gray-800 text-gray-100">
                        <th class="px-4 py-3">Artist / Event</th>
                        <th class="px-4 py-3">Date</th>
                        <th class="px-4 py-3">Venue</th>
                    </tr>
                </thead>
                <tbody id="upcoming-tbody">
                    <tr class="animate-skeleton">
                        <td class="px-4 py-3"><div class="skeleton-bar"></div></td>
                        <td class="px-4 py-3"><div class="skeleton-bar"></div></td>
                        <td class="px-4 py-3"><div class="skeleton-bar"></div></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>
    
    <section class="mb-16">
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-4 border-b border-gray-600 pb-2">
            <h2 class="text-3xl font-semibold text-white">📋 Recorded shows</h2>
            <div class="search-wrapper">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="text" id="recorded-search" class="search-input" placeholder="" onkeyup="filterTable()">
            </div>
        </div>

        <div class="overflow-auto bg-black/20 rounded-lg">
            <table class="w-full table-auto text-sm text-left text-gray-300" id="recorded-table">
                <thead>
                    <tr class="bg-gray-800 text-gray-100">
                        <th class="px-4 py-3">Artist</th>
                        <th class="px-4 py-3">Date</th>
                        <th class="px-4 py-3">Venue</th>
                        <th class="px-4 py-3 text-center">YT</th>
                        <th class="px-4 py-3 text-center">IEM</th>
                        <th class="px-4 py-3 text-center">Format</th>
                        <th class="px-4 py-3 text-center">Audio Sample</th>
                    </tr>
                </thead>
                <tbody id="recorded-tbody"></tbody>
            </table>
        </div>
    </section>
</main>

<footer class="text-center text-sm text-gray-500 py-6 border-t border-gray-700 bg-black/70">
    <div id="yt-subscribers" class="flex justify-center items-center gap-2 mt-4">
        <a class="flex items-center gap-2 text-white hover:text-red-500 transition-colors" href="https://www.youtube.com/@rammfanCZE" target="_blank">
            <i class="fab fa-youtube text-red-600 text-xl"></i>
            <span id="subscriber-count">Loading subscribers…</span>
        </a>
    </div>
    <div class="mt-4 text-gray-400">
        © 2026 <span class="text-red-500 font-bold">rammfanCZE</span> — Created with love for live sound 🎤
    </div>
</footer>

<script>
const URL_RECORDED = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSmAtJ5MvHpsloemXUHYkD-0S0jAyP9RoQLMaOXF-LLUCnW5XlnXE5AAZ2SX3H8SsV7i-RTxx7ZacvI/pub?gid=0&single=true&output=tsv';
const URL_UPCOMING = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSmAtJ5MvHpsloemXUHYkD-0S0jAyP9RoQLMaOXF-LLUCnW5XlnXE5AAZ2SX3H8SsV7i-RTxx7ZacvI/pub?gid=314502273&single=true&output=tsv';

function filterTable() {
    const input = document.getElementById('recorded-search');
    const filter = input.value.toLowerCase();
    const rows = document.getElementById('recorded-tbody').getElementsByTagName('tr');
    for (let i = 0; i < rows.length; i++) {
        const text = rows[i].textContent.toLowerCase();
        rows[i].style.display = text.includes(filter) ? "" : "none";
    }
}

async function fetchSubscribers() {
    const apiKey = 'AIzaSyDDXVwQNZmlOyHiZqQIUYgMZ-w0QgZIX5g';
    const channelId = 'UCRnSUbTJ-cS-ORYCEF9PEsQ';
    try {
        const response = await fetch(`https://www.googleapis.com/youtube/v3/channels?part=statistics&id=${channelId}&key=${apiKey}`);
        const data = await response.json();
        const count = data.items[0].statistics.subscriberCount;
        document.getElementById("subscriber-count").innerText = `${parseInt(count).toLocaleString()} subscribers`;
    } catch (err) { document.getElementById("subscriber-count").innerText = 'YouTube channel'; }
}

async function nactiTabulky() {
    const stahni = async (url, targetId, isRecorded) => {
        try {
            const res = await fetch(url);
            const text = await res.text();
            vykresli(text, targetId, isRecorded);
        } catch (e) {
            document.getElementById(targetId).innerHTML = '<tr><td colspan="7">Error</td></tr>';
        }
    };
    stahni(URL_RECORDED, 'recorded-tbody', true);
    stahni(URL_UPCOMING, 'upcoming-tbody', false);
}

function vykresli(data, targetId, jeToRecorded) {
    const tbody = document.getElementById(targetId);
    let radky = data.split('\n'); radky.shift(); radky.reverse();
    tbody.innerHTML = '';

    for (let i = 0; i < radky.length; i++) {
        const radek = radky[i].trim();
        if (!radek) continue;
        const col = radek.split('\t');
        const tr = document.createElement('tr');
        tr.className = "border-b border-gray-800 hover:bg-gray-800/30 transition-colors";

        if (jeToRecorded) {
            tr.innerHTML = `
                <td class="px-4 py-3 font-bold">${col[0] || ''}</td>
                <td class="px-4 py-3" data-label="Date">${col[1] || ''}</td>
                <td class="px-4 py-3" data-label="Venue">${col[2] || ''}</td>
                <td class="px-4 py-3 text-center" data-label="YT">${col[3]?.includes('http') ? `<a href="${col[3]}" target="_blank" class="text-red-600 text-lg"><i class="fab fa-youtube"></i></a>` : '❌'}</td>
                <td class="px-4 py-3 text-center" data-label="IEM">${col[4] === 'Ano' ? '✅' : '❌'}</td>
                <td class="px-4 py-3 text-center" data-label="Format">${col[7] ? `<a href="${col[7]}" target="_blank" class="underline">${col[5] || ''}</a>` : (col[5] || '')}</td>
                <td class="px-2 py-1
