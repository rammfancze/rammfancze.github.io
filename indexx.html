<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>rammfanCZE IEM archive</title>
    
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&family=Inter:wght@400;600&display=swap" rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"/>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0a0a0a; color: #e5e7eb; }
        h1, h2, h3 { font-family: 'Orbitron', sans-serif; }

        /* MENU MODAL */
        #menu-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.95);
            display: none; flex-direction: column; justify-content: center;
            align-items: center; z-index: 9999;
        }
        #menu-overlay.active { display: flex; }

        /* AUDIO STYLE */
        audio {
            height: 30px; width: 100%; max-width: 200px;
            filter: invert(1) hue-rotate(180deg) brightness(1.5);
            opacity: 0.7;
        }

        /* RESPONSIVITA: Tabulka vs Karty */
        @media (max-width: 768px) {
            .desktop-view { display: none; }
            .mobile-view { display: block; }
        }
        @media (min-width: 769px) {
            .desktop-view { display: block; }
            .mobile-view { display: none; }
        }

        /* STYL KARTY */
        .show-card {
            background: #111; border: 1px solid #222; border-radius: 12px;
            padding: 20px; margin-bottom: 16px; position: relative;
            overflow: hidden; background-size: cover; background-position: center;
        }
        .show-card::before {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(90deg, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.6) 100%);
            z-index: 1;
        }
        .card-content { position: relative; z-index: 2; }

        /* SKELETON */
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        .animate-skeleton { animation: pulse 1.5s infinite; }
    </style>
</head>
<body>

<div id="menu-overlay">
    <button onclick="toggleMenu()" class="absolute top-8 right-8 text-4xl">&times;</button>
    <nav class="flex flex-col gap-8 text-2xl font-bold">
        <a href="#" onclick="toggleMenu()" class="hover:text-red-500 transition">Recorded Shows</a>
        <a href="https://www.youtube.com/@rammfanCZE" target="_blank" class="hover:text-red-500 transition text-red-600">YouTube Channel</a>
    </nav>
</div>

<header class="p-6 bg-black/50 backdrop-blur-md border-b border-gray-800 sticky top-0 z-50">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
        <div>
            <h1 class="text-2xl font-bold text-red-600 tracking-tighter">rammfan<span class="text-white text-3xl">CZE</span></h1>
            <p class="text-[10px] text-gray-500 uppercase tracking-widest">live video recordings // IEM archive</p>
        </div>
        <button onclick="toggleMenu()" class="bg-gray-800 hover:bg-gray-700 px-4 py-2 rounded border border-gray-700 text-xs font-bold transition">
            MENU <i class="fa-solid fa-bars ml-1"></i>
        </button>
    </div>
</header>

<main class="max-w-6xl mx-auto p-4 md:p-12">
    
    <section class="mb-16">
        <h2 class="text-xl font-bold mb-8 flex items-center gap-3 italic">
            <i class="fa-solid fa-record-vinyl text-red-600"></i> RECORDED SHOWS
        </h2>
        
        <div class="desktop-view overflow-hidden rounded-lg border border-gray-800">
            <table class="w-full text-sm text-left">
                <thead class="bg-black/40 text-gray-500 uppercase text-[10px] tracking-widest">
                    <tr>
                        <th class="px-6 py-4">Artist</th>
                        <th class="px-6 py-4">Date / Venue</th>
                        <th class="px-4 py-4 text-center">YT</th>
                        <th class="px-4 py-4 text-center">IEM</th>
                        <th class="px-4 py-4 text-center">Format</th>
                        <th class="px-6 py-4">Sample</th>
                    </tr>
                </thead>
                <tbody id="recorded-tbody">
                    <tr class="animate-skeleton"><td colspan="6" class="p-10 text-center text-gray-600">Loading data...</td></tr>
                </tbody>
            </table>
        </div>

        <div id="recorded-cards" class="mobile-view"></div>
    </section>

    <section>
        <h2 class="text-xl font-bold mb-8 flex items-center gap-3 text-gray-400">
            <i class="fa-regular fa-calendar text-gray-600"></i> UPCOMING SHOWS
        </h2>
        <div class="overflow-hidden rounded-lg border border-gray-800 bg-black/20">
            <table class="w-full text-sm text-left">
                <tbody id="upcoming-tbody" class="divide-y divide-gray-800"></tbody>
            </table>
        </div>
    </section>

</main>

<footer class="text-center py-12 border-t border-gray-900 mt-20">
    <a href="https://www.youtube.com/@rammfanCZE" target="_blank" class="inline-flex items-center gap-2 text-gray-500 hover:text-red-500 transition mb-4">
        <i class="fab fa-youtube text-red-600 text-2xl"></i>
        <span id="subscriber-count">YouTube Channel</span>
    </a>
    <p class="text-[10px] text-gray-700 tracking-[0.3em] uppercase">© 2026 rammfanCZE</p>
</footer>

<script>
const URL_RECORDED = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSmAtJ5MvHpsloemXUHYkD-0S0jAyP9RoQLMaOXF-LLUCnW5XlnXE5AAZ2SX3H8SsV7i-RTxx7ZacvI/pub?gid=0&single=true&output=tsv';
const URL_UPCOMING = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSmAtJ5MvHpsloemXUHYkD-0S0jAyP9RoQLMaOXF-LLUCnW5XlnXE5AAZ2SX3H8SsV7i-RTxx7ZacvI/pub?gid=314502273&single=true&output=tsv';

function toggleMenu() {
    document.getElementById('menu-overlay').classList.toggle('active');
}

async function nacti() {
    try {
        const [resRec, resUp] = await Promise.all([fetch(URL_RECORDED), fetch(URL_UPCOMING)]);
        const dataRec = await resRec.text();
        const dataUp = await resUp.text();
        
        vykresliRecorded(dataRec);
        vykresliUpcoming(dataUp);
    } catch (e) { console.error("Chyba:", e); }
}

function vykresliRecorded(data) {
    const tbody = document.getElementById('recorded-tbody');
    const cards = document.getElementById('recorded-cards');
    tbody.innerHTML = ''; cards.innerHTML = '';
    
    let radky = data.split('\n').slice(1).reverse();
    
    radky.forEach(radek => {
        if(!radek.trim()) return;
        const col = radek.split('\t');
        const [artist, date, venue, yt, iem, format, audio, img] = [col[0], col[1], col[2], col[3]?.trim(), col[4]?.trim(), col[5], col[6]?.trim(), col[7]?.trim()];

        // Desktop
        const tr = document.createElement('tr');
        tr.className = "border-b border-gray-900 hover:bg-white/5 transition";
        tr.innerHTML = `
            <td class="px-6 py-4 font-bold text-white">${artist}</td>
            <td class="px-6 py-4"><div class="text-white">${date}</div><div class="text-[10px] text-gray-500 uppercase">${venue}</div></td>
            <td class="text-center">${yt?.includes('http') ? `<a href="${yt}" target="_blank" class="text-red-600 text-lg"><i class="fab fa-youtube"></i></a>` : '❌'}</td>
            <td class="text-center">${iem === 'Ano' ? '<i class="fa-solid fa-square-check text-green-500 text-lg"></i>' : '❌'}</td>
            <td class="text-center">${img?.includes('http') ? `<a href="${img}" target="_blank" class="text-[10px] font-mono border border-gray-700 px-2 py-1 rounded hover:bg-white hover:text-black transition">${format}</a>` : format}</td>
            <td class="px-6 py-4">${audio?.includes('http') ? `<audio controls src="${audio}"></audio>` : ''}</td>
        `;
        tbody.appendChild(tr);

        // Mobile
        const card = document.createElement('div');
        card.className = "show-card";
        if(img?.includes('http')) card.style.backgroundImage = `url('${img}')`;
        card.innerHTML = `
            <div class="card-content">
                <div class="flex justify-between items-start">
                    <div>
                        <h3 class="font-bold text-white text-lg">${artist}</h3>
                        <p class="text-xs text-gray-400">${date} • ${venue}</p>
                    </div>
                    ${yt?.includes('http') ? `<a href="${yt}" target="_blank" class="text-red-600 text-2xl"><i class="fab fa-youtube"></i></a>` : ''}
                </div>
                <div class="flex gap-3 my-4">
                    ${iem === 'Ano' ? '<span class="text-[10px] bg-green-600/20 text-green-500 px-2 py-0.5 rounded border border-green-600/30">IEM</span>' : ''}
                    <span class="text-[10px] bg-white/10 text-gray-400 px-2 py-0.5 rounded">${format}</span>
                </div>
                ${audio?.includes('http') ? `<audio class="w-full mt-2" controls src="${audio}"></audio>` : ''}
            </div>
        `;
        cards.appendChild(card);
    });
}

function vykresliUpcoming(data) {
    const tbody = document.getElementById('upcoming-tbody');
    tbody.innerHTML = '';
    let radky = data.split('\n').slice(1).reverse();
    radky.forEach(radek => {
        if(!radek.trim()) return;
        const col = radek.split('\t');
        const tr = document.createElement('tr');
        tr.innerHTML = `<td class="px-6 py-4 font-bold text-gray-300">${col[0]}</td><td class="px-6 py-4 text-gray-500">${col[1]}</td><td class="px-6 py-4 text-gray-600 text-xs uppercase">${col[2]}</td>`;
        tbody.appendChild(tr);
    });
}

nacti();
</script>
</body>
</html>
