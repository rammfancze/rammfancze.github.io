<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>rammfanCZE IEM archive</title>
    
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&family=Inter:wght@400;600&display=swap" rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />

    <style>
        :root { --plyr-color-main: #ef4444; }
        body { font-family: 'Inter', sans-serif; background-color: #0b0f1a; color: white; }
        h1, h2, h3 { font-family: 'Orbitron', sans-serif; }

        .format-clickable { color: #ef4444; cursor: pointer; text-decoration: underline; font-weight: 600; }

        /* --- MODAL (PILLOWCASE STYLE) --- */
        #spec-modal { 
            display: none; 
            position: fixed; 
            inset: 0; 
            z-index: 9999; 
            background: rgba(0,0,0,0.9); 
            align-items: center; 
            justify-content: center; 
        }
        .modal-inner {
            width: 95%;
            max-width: 1000px;
            background: #000;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 25px;
            position: relative;
        }
        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 28px;
            cursor: pointer;
            color: #888;
        }
        .close-btn:hover { color: #fff; }

        /* Responzivita tabulky (zachování tvého originálu) */
        @media (max-width: 768px) {
            thead { display: none; }
            tbody tr { display: flex; flex-direction: column; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 0.75rem; margin-bottom: 1rem; padding: 1rem; }
            tbody td { display: flex; justify-content: space-between; padding: 0.6rem 0; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
            tbody td::before { content: attr(data-label); font-weight: 600; color: #9ca3af; font-size: 0.75rem; text-transform: uppercase; }
        }
    </style>
</head>

<body class="bg-gradient-to-br from-gray-900 via-gray-800 to-black min-h-screen">

<div id="spec-modal" onclick="closeModal()">
    <div class="modal-inner" onclick="event.stopPropagation()">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <h3 id="modal-title" class="text-red-500 mb-4 text-lg font-bold uppercase"></h3>
        
        <div id="loader-status" class="text-sm text-gray-500 font-mono mb-4 animate-pulse">
            ⌛ ANALYZING FREQUENCIES...
        </div>

        <div id="spectrogram-container" style="background: #000; border-radius: 4px; overflow: hidden;"></div>
        
        <div id="waveform-hidden" style="display:none"></div>
    </div>
</div>

<header class="p-6 md:p-8 bg-black/70 border-b border-gray-700">
    <div class="max-w-6xl mx-auto">
        <h1 class="text-3xl font-bold text-red-500">rammfanCZE</h1>
        <p class="text-gray-400">IEM archive // Audio Analysis</p>
    </div>
</header>

<main class="max-w-6xl mx-auto p-4 md:p-12">
    <section class="mb-16">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-semibold">📋 Recorded shows</h2>
            <input type="text" id="recorded-search" class="bg-gray-800 border border-gray-700 rounded px-3 py-1 text-sm" placeholder="Search..." onkeyup="filterTable()">
        </div>

        <div class="bg-black/20 rounded-lg overflow-hidden">
            <table class="w-full text-sm text-left text-gray-300">
                <thead class="bg-gray-800 text-gray-100">
                    <tr>
                        <th class="px-4 py-3">Artist</th>
                        <th class="px-4 py-3">Date</th>
                        <th class="px-4 py-3 text-center">Format</th>
                        <th class="px-4 py-3 text-right">Preview</th>
                    </tr>
                </thead>
                <tbody id="recorded-tbody"></tbody>
            </table>
        </div>
    </section>
</main>

<script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
<script src="https://unpkg.com/wavesurfer.js@7"></script>
<script src="https://unpkg.com/wavesurfer.js@7/dist/plugins/spectrogram.min.js"></script>

<script>
const URL_RECORDED = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSmAtJ5MvHpsloemXUHYkD-0S0jAyP9RoQLMaOXF-LLUCnW5XlnXE5AAZ2SX3H8SsV7i-RTxx7ZacvI/pub?gid=0&single=true&output=tsv';

let activeWs = null;

async function loadData() {
    try {
        const res = await fetch(URL_RECORDED);
        const text = await res.text();
        const rows = text.split('\n').slice(1).reverse();
        const tbody = document.getElementById('recorded-tbody');

        rows.forEach((line, i) => {
            const col = line.split('\t');
            if (!col[0]) return;
            const audioUrl = col[6]?.trim() || '';

            const tr = document.createElement('tr');
            tr.className = "border-b border-gray-800 hover:bg-gray-800/30 transition-colors";
            tr.innerHTML = `
                <td class="px-4 py-4 font-semibold" data-label="Artist">${col[0]}</td>
                <td class="px-4 py-4 text-gray-400" data-label="Date">${col[1]}</td>
                <td class="px-4 py-4 text-center" data-label="Format">
                    <span class="format-clickable" onclick="openSpec('${col[0]}', '${audioUrl}')">${col[5] || 'WAV'}</span>
                </td>
                <td class="px-4 py-4" data-label="Audio">
                    <div style="width:220px; margin-left:auto;">
                        <audio class="js-player" controls src="${audioUrl}" crossorigin="anonymous"></audio>
                    </div>
                </td>
            `;
            tbody.appendChild(tr);
        });
        Plyr.setup('.js-player');
    } catch (e) { console.error(e); }
}

function openSpec(artist, url) {
    if (!url) return;
    
    const modal = document.getElementById('spec-modal');
    modal.style.display = 'flex';
    document.getElementById('modal-title').innerText = artist + " - Analysis";
    document.getElementById('loader-status').style.display = 'block';
    document.getElementById('spectrogram-container').innerHTML = '';

    if (activeWs) activeWs.destroy();

    // Vytvoření WaveSurferu s opravou pro CORS
    activeWs = WaveSurfer.create({
        container: '#waveform-hidden',
        url: url,
        // Tento řádek je klíčový pro to, aby se analýza nezasekla
        fetchParams: { mode: 'cors' }, 
        plugins: [
            WaveSurfer.Spectrogram.create({
                container: '#spectrogram-container',
                labels: true,
                height: 350,
                // Barevná mapa přesně podle tvého obrázku (libavfilter)
                colorMap: [
                    [0, 0, 0, 1],       // Ticho (černá)
                    [0.1, 0, 0.5, 1],   // Nízké (modrá)
                    [0.4, 0, 1, 0],     // Střední (zelená)
                    [0.7, 1, 1, 0],     // Vysoké (žlutá)
                    [1, 1, 0, 0]        // Špičky (červená)
                ]
            })
        ]
    });

    activeWs.on('ready', () => {
        document.getElementById('loader-status').style.display = 'none';
    });
    
    activeWs.on('error', (e) => {
        document.getElementById('loader-status').innerText = "❌ Nelze analyzovat soubor (CORS blokace).";
        console.error(e);
    });
}

function closeModal() {
    document.getElementById('spec-modal').style.display = 'none';
    if (activeWs) activeWs.destroy();
}

function filterTable() {
    const val = document.getElementById('recorded-search').value.toLowerCase();
    document.querySelectorAll('#recorded-tbody tr').forEach(r => {
        r.style.display = r.textContent.toLowerCase().includes(val) ? "" : "none";
    });
}

loadData();
</script>
</body>
</html>
