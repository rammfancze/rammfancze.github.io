<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>rammfanCZE IEM archive</title>
    
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"/>

    <style>
        body { font-family: 'Inter', sans-serif; background: #111827; color: white; }
        
        .waveform-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 16px;
            border-radius: 8px;
            width: 450px; /* Dostatek místa pro vše v jedné řadě */
        }

        .waveform-container {
            flex-grow: 1;
            height: 35px;
            min-width: 150px;
        }

        .time-display {
            font-family: monospace;
            font-size: 0.75rem;
            color: #9ca3af;
            white-space: nowrap;
        }

        .volume-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .volume-slider {
            width: 60px;
            height: 4px;
            accent-color: #ef4444;
            cursor: pointer;
        }

        .play-btn, .mute-btn {
            color: #ef4444;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.1rem;
            width: 24px;
        }

        @media (max-width: 1024px) {
            .waveform-wrapper { width: 100%; max-width: 350px; }
        }
    </style>
</head>
<body>

<main class="max-w-7xl mx-auto p-4 md:p-12">
    <h2 class="text-2xl font-bold mb-6 border-b border-gray-700 pb-2">📋 Recorded shows</h2>
    <div class="overflow-x-auto bg-gray-900/50 rounded-lg">
        <table class="w-full text-sm text-left text-gray-300">
            <thead class="bg-gray-800 text-gray-100 uppercase text-xs">
                <tr>
                    <th class="px-4 py-3">Artist</th>
                    <th class="px-4 py-3">Date</th>
                    <th class="px-4 py-3 text-center">Format</th>
                    <th class="px-4 py-3 text-right">Audio Sample</th>
                </tr>
            </thead>
            <tbody id="recorded-tbody"></tbody>
        </table>
    </div>
</main>

<script src="https://unpkg.com/wavesurfer.js@7"></script>

<script>
const URL_RECORDED = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSmAtJ5MvHpsloemXUHYkD-0S0jAyP9RoQLMaOXF-LLUCnW5XlnXE5AAZ2SX3H8SsV7i-RTxx7ZacvI/pub?gid=0&single=true&output=tsv';

// Falešná data pro vlnovku, aby tam byla hned
const fakePeaks = [0.1, 0.4, 0.2, 0.5, 0.8, 0.6, 0.3, 0.5, 0.9, 0.7, 0.4, 0.6, 0.8, 0.3, 0.5, 0.2, 0.4, 0.7, 0.5, 0.3, 0.6, 0.9, 0.4, 0.2, 0.5, 0.8, 0.6, 0.3];

function formatTime(s) {
    const m = Math.floor(s / 60);
    const secs = Math.floor(s % 60);
    return `${m}:${secs.toString().padStart(2, '0')}`;
}

async function nactiData() {
    const res = await fetch(URL_RECORDED);
    const text = await res.text();
    const radky = text.split('\n');
    radky.shift();
    radky.reverse();

    const tbody = document.getElementById('recorded-tbody');
    radky.forEach((radek, i) => {
        const col = radek.trim().split('\t');
        if (!col[0]) return;
        const audioUrl = col[6]?.trim();

        const tr = document.createElement('tr');
        tr.className = "border-b border-gray-800 hover:bg-gray-800/40 transition-colors";
        tr.innerHTML = `
            <td class="px-4 py-4 font-semibold">${col[0]}</td>
            <td class="px-4 py-4">${col[1]}</td>
            <td class="px-4 py-4 text-center">${col[5] || ''}</td>
            <td class="px-4 py-4">
                ${audioUrl ? `
                <div class="waveform-wrapper ml-auto">
                    <button class="play-btn" id="play-${i}"><i class="fas fa-play"></i></button>
                    <div id="wave-${i}" class="waveform-container"></div>
                    <div class="time-display" id="time-${i}">0:00 / 0:00</div>
                    <div class="volume-controls">
                        <button class="mute-btn" id="mute-${i}"><i class="fas fa-volume-up"></i></button>
                        <input type="range" class="volume-slider" id="vol-${i}" min="0" max="1" step="0.05" value="0.7">
                    </div>
                </div>` : ''}
            </td>
        `;
        tbody.appendChild(tr);

        if (audioUrl) {
            const ws = WaveSurfer.create({
                container: `#wave-${i}`,
                waveColor: '#4b5563',
                progressColor: '#ef4444',
                barWidth: 2,
                barGap: 3,
                barRadius: 4,
                height: 35,
                url: audioUrl,
                mediaElement: true,
                peaks: [fakePeaks] 
            });

            const playBtn = document.getElementById(`play-${i}`);
            const muteBtn = document.getElementById(`mute-${i}`);
            const volSlider = document.getElementById(`vol-${i}`);
            const timeInfo = document.getElementById(`time-${i}`);

            playBtn.onclick = () => ws.playPause();
            ws.on('play', () => playBtn.innerHTML = '<i class="fas fa-pause"></i>');
            ws.on('pause', () => playBtn.innerHTML = '<i class="fas fa-play"></i>');

            volSlider.oninput = (e) => ws.setVolume(e.target.value);
            muteBtn.onclick = () => {
                const current = ws.getVolume();
                if (current > 0) {
                    ws.setVolume(0);
                    volSlider.value = 0;
                    muteBtn.innerHTML = '<i class="fas fa-volume-mute"></i>';
                } else {
                    ws.setVolume(0.7);
                    volSlider.value = 0.7;
                    muteBtn.innerHTML = '<i class="fas fa-volume-up"></i>';
                }
            };

            ws.on('decode', (d) => timeInfo.innerText = `0:00 / ${formatTime(d)}`);
            ws.on('timeupdate', (t) => timeInfo.innerText = `${formatTime(t)} / ${formatTime(ws.getDuration())}`);
        }
    });
}

nactiData();
</script>
</body>
</html>
