<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>rammfanCZE IEM archive</title>
    
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&family=Inter:wght@400;600&display=swap" rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"/>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0a0a0a; color: #e5e7eb; margin: 0; }
        h1, h2, h3 { font-family: 'Orbitron', sans-serif; }

        /* MENU MODAL - Musí být nad vším */
        #menu-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.98);
            display: none; flex-direction: column; justify-content: center;
            align-items: center; z-index: 9999;
        }
        #menu-overlay.active { display: flex; }

        /* AUDIO STYLE */
        audio {
            height: 30px; width: 100%; max-width: 200px;
            filter: invert(1) hue-rotate(180deg) brightness(1.5);
            opacity: 0.7;
        }

        /* RESPONSIVITA */
        @media (max-width: 768px) {
            .desktop-view { display: none; }
            .mobile-view { display: block; }
        }
        @media (min-width: 769px) {
            .desktop-view { display: block; }
            .mobile-view { display: none; }
        }

        /* STYL KARTY */
        .show-card {
            background: #111; border: 1px solid #222; border-radius: 12px;
            padding: 20px; margin-bottom: 16px; position: relative;
            overflow: hidden; background-size: cover; background-position: center;
        }
        .show-card::before {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(90deg, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.6) 100%);
            z-index: 1;
        }
        .card-content { position: relative; z-index: 2; }

        /* Odkazy ve formátu */
        .format-link {
            text-decoration: underline;
            text-decoration-color: #444;
            transition: all 0.2s;
        }
        .format-link:hover {
            color: white;
            text-decoration-color: white;
        }
    </style>
</head>
<body>

<div id="menu-overlay">
    <button onclick="toggleMenu()" class="absolute top-8 right-8 text-4xl text-white">&times;</button>
    <nav class="flex flex-col gap-10 text-3xl font-bold text-center">
        <a href="#" onclick="toggleMenu()" class="hover:text-red-600 transition">Recorded Shows</a>
        <a href="#upcoming-section" onclick="toggleMenu()" class="hover:text-red-600 transition">Upcoming</a>
        <a href="https://www.youtube.com/@rammfanCZE" target="_blank" class="text-red-600 hover:text-white transition">YouTube Channel</a>
    </nav>
</div>

<header class="p-6 bg-black/80 backdrop-blur-md border-b border-gray-800 sticky top-0 z-50">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
        <div>
            <h1 class="text-2xl font-bold text-red-600 tracking-tighter">rammfan<span class="text-white">CZE</span></h1>
            <p class="text-[10px] text-gray-500 uppercase tracking-widest">live video recordings // IEM archive</p>
        </div>
        <button onclick="toggleMenu()" class="bg-gray-800 hover:bg-gray-700 px-4 py-2 rounded border border-gray-700 text-xs font-bold transition flex items-center gap-2">
            MENU <i class="fa-solid fa-bars"></i>
        </button>
    </div>
</header>

<main class="max-w-6xl mx-auto p-4 md:p-12">
    
    <section class="mb-20">
        <h2 class="text-xl font-bold mb-8 flex items-center gap-3 italic">
            <i class="fa-solid fa-record-vinyl text-red-600"></i> RECORDED SHOWS
        </h2>
        
        <div class="desktop-view overflow-hidden rounded-xl border border-gray-800 bg-black/30">
            <table class="w-full text-sm text-left">
                <thead class="bg-black/50 text-gray-500 uppercase text-[10px] tracking-[0.2em]">
                    <tr>
                        <th class="px-6 py-4">Artist</th>
                        <th class="px-6 py-4">Date / Venue</th>
                        <th class="px-4 py-4 text-center">YT</th>
                        <th class="px-4 py-4 text-center">IEM</th>
                        <th class="px-4 py-4 text-center">Format</th>
                        <th class="px-6 py-4">Sample</th>
                    </tr>
                </thead>
                <tbody id="recorded-tbody" class="divide-y divide-gray-900">
                    </tbody>
            </table>
        </div>

        <div id="recorded-cards" class="mobile-view"></div>
    </section>

    <section id="upcoming-section">
        <h2 class="text-xl font-bold mb-8 flex items-center gap-3 text-gray-500 italic">
            <i class="fa-regular fa-calendar text-gray-600"></i> UPCOMING SHOWS
        </h2>
        <div class="overflow-hidden rounded-xl border border-gray-800 bg-black/20">
            <table class="w-full text-sm text-left">
                <tbody id="upcoming-tbody" class="divide-y divide-gray-800">
                    </tbody>
            </table>
        </div>
    </section>

</main>

<footer class="text-center py-16 border-t border-gray-900 mt-20">
    <a href="https://www.youtube.com/@rammfanCZE" target="_blank" class="inline-flex flex-col items-center gap-3 group">
        <i class="fab fa-youtube text-red-600 text-3xl group-hover:scale-110 transition"></i>
        <span id="subscriber-count" class="text-gray-400 text-sm font-semibold tracking-wide">YouTube Channel</span>
    </a>
    <p class="mt-8 text-[9px] text-gray-7
