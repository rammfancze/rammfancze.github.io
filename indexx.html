<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>rammfanCZE IEM archive</title>
    
    <meta property="og:title" content="rammfanCZE IEM archive" />
    <meta property="og:description" content="live video recordings // IEM archive" />
    <meta property="og:image" content="https://raw.githubusercontent.com/rammfancze/rammfancze.github.io/refs/heads/main/logo.png" />
    
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&family=Inter:wght@400;600&display=swap" rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"/>

    <style>
        body { font-family: 'Inter', sans-serif; }
        h1, h2, h3 { font-family: 'Orbitron', sans-serif; }

        /* Animace pro Skeleton Loading */
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        .animate-skeleton {
            animation: pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        .skeleton-bar {
            height: 12px;
            background: rgba(156, 163, 175, 0.3);
            border-radius: 4px;
            width: 100%;
        }

        /* Styl pro vyhledávání */
        .search-wrapper {
            position: relative;
            max-width: 300px;
        }
        .search-input {
            width: 100%;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 6px;
            padding: 8px 12px 8px 35px;
            color: white;
            outline: none;
            font-size: 0.875rem;
            transition: all 0.2s;
        }
        .search-input:focus {
            background: rgba(255,255,255,0.1);
            border-color: #ef4444;
        }
        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #6b7280;
            font-size: 0.8rem;
        }

        /* RESPONZIVNÍ ÚPRAVA PRO MOBILY */
        @media (max-width: 768px) {
            table, thead, tbody, th, td, tr { 
                display: block; 
            }
            thead tr { 
                position: absolute;
                top: -9999px;
                left: -9999px;
            }
            tr { 
                margin-bottom: 1rem; 
                border: 1px solid rgba(255,255,255,0.1) !important;
                border-radius: 8px;
                background: rgba(0,0,0,0.2);
                padding: 0.5rem;
            }
            td { 
                border: none !important;
                position: relative;
                padding-left: 50% !important; 
                text-align: right !important;
                margin-bottom: 0.25rem;
            }
            td:before { 
                position: absolute;
                left: 12px;
                width: 45%; 
                padding-right: 10px; 
                white-space: nowrap;
                text-align: left;
                font-weight: bold;
                color: #6b7280;
                content: attr(data-label);
            }
            /* První buňka (Artist) bude vypadat jako nadpis karty */
            td:first-child {
                text-align: center !important;
                padding-left: 12px !important;
                font-size: 1.1rem;
                color: #ef4444;
                border-bottom: 1px solid rgba(255,255,255,0.1) !important;
                margin-bottom: 0.5rem;
            }
            td:first-child:before { content: ""; }
            
            audio { width: 100% !important; max-width: none !important; }
        }
    </style>
</head>

<body class="bg-gradient-to-br from-gray-900 via-gray-800 to-black text-white min-h-screen">
