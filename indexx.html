<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>rammfanCZE IEM archive</title>
    
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&family=Inter:wght@400;600&display=swap" rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"/>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0d1117; }
        h1, h2, h3 { font-family: 'Orbitron', sans-serif; }

        .search-wrapper { position: relative; max-width: 300px; }
        .search-input {
            width: 100%; background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 6px;
            padding: 8px 12px 8px 35px; color: white; outline: none;
        }
        .search-input:focus { border-color: #ef4444; }
        .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #6b7280; font-size: 0.8rem; }

        /* PŮVODNÍ STYL PŘEHRÁVAČE */
        audio { 
            height: 30px; width: 100%; max-width: 200px;
            filter: invert(1) hue-rotate(180deg) brightness(1.2);
            opacity: 0.7; transition: opacity 0.2s;
        }
        audio:hover { opacity: 1; }

        /* RESPONZIVNÍ KARTY */
        @media (max-width: 768px) {
            table, thead, tbody, th, td, tr { display: block; }
            thead { display: none; }
            
            tr {
                background: linear-gradient(145deg, rgba(255,255,255,0.05), rgba(0,0,0,0.2));
                border: 1px solid rgba(255,255,255,0.1) !important;
                border-radius: 12px; margin-bottom: 1.5rem; padding: 1rem;
            }

            td {
                display: flex; justify-content: space-between; align-items: center;
                padding: 0.6rem 0 !important; border: none !important;
            }

            /* Popisky pro mobil */
            td::before {
                content: attr(data-label);
                font-weight: 600; font-size: 0.7rem;
                text-transform: uppercase; color: #6b7280;
            }

            /* Interpret jako hlavní nadpis karty */
            td:first-child {
                font-size: 1.25rem; font-weight: bold; color: white;
                border-bottom: 1px solid rgba(255,255,255,0.1) !important;
                margin-bottom: 0.5rem; padding-bottom: 0.8rem !important;
                justify-content: flex-start;
            }
            td:first-child::before { content: none; }

            audio { max-width: none; margin-top: 0.5rem; }
        }
    </style>
</head>

<body class="text-white min-h-screen">

<header class="p-8 bg-black/40 backdrop-blur-md border-b border-gray-800">
    <div class="max-w-6xl mx-auto flex flex-col gap-2">
        <h1 class="text-4xl font-bold text-red-600 tracking-tighter">rammfanCZE</h1>
        <p class="text-gray-400 text-sm uppercase tracking-widest">live video recordings // IEM archive</p>
    </div>
</header>

<main class="max-w-6xl mx-auto p-6 md:p-12">
    <section class="mb-20">
        <h2 class="text-2xl font-bold mb-6 flex items-center gap-3">
            <span class="text-2xl">📅</span> Upcoming shows
        </h2>
        <div class="bg-black/20 rounded-xl overflow-hidden border border-gray-800">
            <table class="w-full text-sm text-left">
                <thead class="bg-gray-900/50 text-gray-400 uppercase text-xs">
                    <tr>
                        <th class="px-6 py-4">Artist / Event</th>
                        <th class="px-6 py-4">
